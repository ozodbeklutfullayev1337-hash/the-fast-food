<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:; script-src * 'unsafe-inline' 'unsafe-eval'; style-src * 'unsafe-inline';">
    <title>THE FAST FOOD // Ultra-Luxury Edition</title>

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- React 18 & Babel -->
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Luxury Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-marble: #fcfbf9;
            --gold-primary: #c5a059;
            --gold-light: #f3e5ab;
            --gold-dark: #8c6d33;
            --rich-black: #111111;
            --card-bg: #ffffff;
            --shadow-lux: 0 20px 40px -15px rgba(197, 160, 89, 0.15);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-marble);
            color: var(--rich-black);
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            margin: 0;
        }

        .font-serif-lux { font-family: 'Cormorant Garamond', serif; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Ultra-Luxury Gold Gradient & Borders */
        .gold-gradient-text {
            background: linear-gradient(135deg, #8c6d33 0%, #c5a059 50%, #e6ca65 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gold-card {
            background: #ffffff;
            border: 1px solid rgba(197, 160, 89, 0.2);
            box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.05), 0 5px 15px rgba(197, 160, 89, 0.08);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .gold-card:hover {
            border-color: rgba(197, 160, 89, 0.6);
            transform: translateY(-3px);
            box-shadow: 0 25px 50px -12px rgba(197, 160, 89, 0.25);
        }

        .btn-gold {
            background: linear-gradient(135deg, #d4af37 0%, #c5a059 50%, #997a36 100%);
            color: #ffffff;
            box-shadow: 0 10px 25px -5px rgba(197, 160, 89, 0.4);
            transition: all 0.25s ease;
        }
        .btn-gold:active {
            transform: scale(0.95);
        }

        @keyframes floatSlow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .anim-float { animation: floatSlow 4s infinite ease-in-out; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const ADMIN_TELEGRAM_ID = "6515742580";

        const SoundFX = {
            play(type = 'tick') {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const now = ctx.currentTime;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.04);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } catch (e) {}
            }
        };

        const MASSIVE_MENU = [
            {
                id: 1,
                name: "Royal Wagyu Gold Burger",
                code: "VIP-01",
                tagline: "A5 Marmar mol go'shti • Tilla barglari",
                description: "A5 darajadagi Wagyu go'shti kotleti, 24 karatli edible tilla bargi, 36 oy yetilgan parmesan va truffel sousi.",
                image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=1200&q=90",
                oldPrice: 95000,
                newPrice: 78000,
                category: "Burgerlar",
                badge: "CHEF'S SIGNATURE 👑",
                prepTime: "14 daq",
                kcal: "780 KCAL",
                featured: true
            },
            {
                id: 2,
                name: "Black Diamond Angus Burger",
                code: "VIP-02",
                tagline: "Qora ko'mir briosh • Dudlangan Gouda",
                description: "Qora bambuk ko'mirli premium non, qalin Black Angus kotleti, qo'ziqorinli julen va erigan gouda pishlog'i.",
                image: "https://images.unsplash.com/photo-1586190848861-99aa4a171e90?auto=format&fit=crop&w=1200&q=90",
                oldPrice: 85000,
                newPrice: 69000,
                category: "Burgerlar",
                badge: "LIMITED",
                prepTime: "12 daq",
                kcal: "820 KCAL",
                featured: true
            },
            {
                id: 3,
                name: "Imperial Crispy Chicken Burger",
                code: "VIP-03",
                tagline: "Tokyo Panko • Sarimsoqli Truffle Ranch",
                description: "Qarsildoq panirovkadagi tanlab olingan tovuq filesi, aysberg, cheddar va maxsus mualliflik sousi.",
                image: "https://images.unsplash.com/photo-1615297928064-24977384d0da?auto=format&fit=crop&w=1200&q=90",
                oldPrice: 62000,
                newPrice: 49000,
                category: "Burgerlar",
                badge: "CRUNCHY",
                prepTime: "10 daq",
                kcal: "640 KCAL",
                featured: false
            },
            {
                id: 4,
                name: "New York Royal Hot-Dog",
                code: "VIP-04",
                tagline: "Dudlangan bratwurst • Cheddar fondyu",
                description: "Grilda pishirilgan maxsus kolbasa, issiq cheddar fondyu sousi, mol go'shtli chili va xalapenyo bo'laklari.",
                image: "https://images.unsplash.com/photo-1619740455993-9e612b1af08a?auto=format&fit=crop&w=1200&q=90",
                oldPrice: 50000,
                newPrice: 39000,
                category: "Hot-Doglar",
                badge: "BESTSELLER",
                prepTime: "8 daq",
                kcal: "560 KCAL",
                featured: true
            },
            {
                id: 5,
                name: "Elite Ribeye Doner Lavash",
                code: "VIP-05",
                tagline: "Tandir lavash • Marmar mol go'shti",
                description: "Tandirda yopilgan qarsildoq lavash ichida sersuv mol go'shti doneri, pomidor, chipslar va mozzarella.",
                image: "https://images.unsplash.com/photo-1626700051175-6818013e1d4f?auto=format&fit=crop&w=1200&q=90",
                oldPrice: 52000,
                newPrice: 42000,
                category: "Lavash",
                badge: "TOP RATED",
                prepTime: "10 daq",
                kcal: "680 KCAL",
                featured: true
            },
            {
                id: 6,
                name: "Gold Truffle Pepperoni Pitsa",
                code: "VIP-06",
                tagline: "Wood-Fired • Fior di Latte • Peperoni",
                description: "48 soat yetilgan xamir, Fior di Latte mozzarella, ikki hissa qarsildoq peperoni va truffel yog'i.",
                image: "https://images.unsplash.com/photo-1628840042765-356cda07504e?auto=format&fit=crop&w=1200&q=90",
                oldPrice: 105000,
                newPrice: 89000,
                category: "Pitsa",
                badge: "WOOD OVEN 🔥",
                prepTime: "16 daq",
                kcal: "1150 KCAL",
                featured: true
            },
            {
                id: 7,
                name: "Belgian Gold Fries & Cheese",
                code: "VIP-07",
                tagline: "Ikki marta qovurilgan • Suyuq Cheddar",
                description: "Oltinrang kartoshka fri, ustidan issiq cheddar pishloq fondyusi va sarimsoqli ko'katlar.",
                image: "https://images.unsplash.com/photo-1576107232684-1279f3908594?auto=format&fit=crop&w=1200&q=90",
                oldPrice: 38000,
                newPrice: 29000,
                category: "Sneklar",
                badge: "CHEESY",
                prepTime: "6 daq",
                kcal: "480 KCAL",
                featured: false
            },
            {
                id: 8,
                name: "Chateau Sparkling Lemonade",
                code: "VIP-08",
                tagline: "Qulupnay • Fresh Laym • Mint",
                description: "Yangi uzilgan tog' qulupnayi, laym sharbati, yalpiz barglari va salqin mineral gazli suv.",
                image: "https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?auto=format&fit=crop&w=1200&q=90",
                oldPrice: 28000,
                newPrice: 20000,
                category: "Ichimliklar",
                badge: "REFRESHING",
                prepTime: "3 daq",
                kcal: "130 KCAL",
                featured: false
            }
        ];

        const EXTRAS = [
            { id: 'wagyu', name: "Qo'shimcha Wagyu Kotleti", price: 18000 },
            { id: 'cheddar', name: "Qo'shimcha Cheddar Pishloq", price: 7000 },
            { id: 'truffle', name: "Qora Truffel Sousi", price: 6000 },
            { id: 'jalapeno', name: "Achchiq Xalapenyo", price: 4000 }
        ];

        function App() {
            const [viewMode, setViewMode] = useState('client');
            const [adminTab, setAdminTab] = useState('orders');
            const [isAdminAuthed, setIsAdminAuthed] = useState(false);
            const [products, setProducts] = useState(MASSIVE_MENU);
            const [activeCategory, setActiveCategory] = useState("Barchasi");
            const [search, setSearch] = useState("");
            const [cart, setCart] = useState([]);
            const [selectedProduct, setSelectedProduct] = useState(null);
            const [selectedExtras, setSelectedExtras] = useState([]);
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [isOrdersOpen, setIsOrdersOpen] = useState(false);
            const [userOrders, setUserOrders] = useState([]);
            const [adminOrders, setAdminOrders] = useState([]);

            const [customerPhone, setCustomerPhone] = useState("+998 ");
            const [customerLocation, setCustomerLocation] = useState("");

            const [successOrder, setSuccessOrder] = useState(false);
            const [submitting, setSubmitting] = useState(false);
            const [toast, setToast] = useState(null);

            const [newProd, setNewProd] = useState({
                name: '', description: '', image: '', oldPrice: '', newPrice: '', category: 'Burgerlar'
            });

            const tg = window.Telegram?.WebApp;
            const tgUser = tg?.initDataUnsafe?.user || { id: ADMIN_TELEGRAM_ID, first_name: "Ozodbek" };

            useEffect(() => {
                if (tg) {
                    tg.ready();
                    tg.expand();
                    try {
                        tg.setHeaderColor('#fcfbf9');
                        tg.setBackgroundColor('#fcfbf9');
                    } catch (e) {}
                }
                fetchProducts();
                if (tgUser && String(tgUser.id) === ADMIN_TELEGRAM_ID) {
                    setIsAdminAuthed(true);
                }
            }, []);

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 2200);
            };

            const fetchProducts = async () => {
                try {
                    const res = await fetch('/api/products');
                    const data = await res.json();
                    if (Array.isArray(data) && data.length >= 4) {
                        setProducts(data);
                    }
                } catch (e) {}
            };

            const fetchAdminData = async () => {
                try {
                    const [ordRes, prodRes] = await Promise.all([
                        fetch('/api/admin/orders'),
                        fetch('/api/admin/products')
                    ]);
                    const ordData = await ordRes.json();
                    const prodData = await prodRes.json();
                    setAdminOrders(Array.isArray(ordData) ? ordData : []);
                    if (Array.isArray(prodData) && prodData.length > 0) setProducts(prodData);
                } catch (e) {}
            };

            const detectGpsAddress = () => {
                SoundFX.play('tick');
                if (!navigator.geolocation) {
                    showToast("GPS mavjud emas");
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    async (pos) => {
                        const { latitude, longitude } = pos.coords;
                        try {
                            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&accept-language=uz`);
                            const data = await res.json();
                            if (data?.display_name) {
                                setCustomerLocation(data.display_name);
                                showToast("📍 GPS manzil aniqlandi!");
                            } else {
                                setCustomerLocation(`GPS: ${latitude.toFixed(5)}, ${longitude.toFixed(5)}`);
                            }
                        } catch (err) {
                            setCustomerLocation(`GPS: ${latitude.toFixed(5)}, ${longitude.toFixed(5)}`);
                        }
                    },
                    () => showToast("GPS ruxsati berilmadi")
                );
            };

            const categories = useMemo(() => {
                return ["Barchasi", ...new Set(products.map(p => p.category || "Burgerlar"))];
            }, [products]);

            const filtered = useMemo(() => {
                return products.filter(p => {
                    const matchCat = activeCategory === "Barchasi" || (p.category || "Burgerlar") === activeCategory;
                    const matchSearch = p.name.toLowerCase().includes(search.toLowerCase()) || p.description.toLowerCase().includes(search.toLowerCase());
                    return matchCat && matchSearch;
                });
            }, [products, activeCategory, search]);

            const addToCart = (product, extras = [], e) => {
                if (e) e.stopPropagation();
                SoundFX.play('tick');
                if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

                const extrasPrice = extras.reduce((s, x) => s + x.price, 0);
                const extrasText = extras.length > 0 ? ` (+ ${extras.map(x => x.name).join(', ')})` : '';
                const cartItemId = `${product.id}-${extras.map(x => x.id).join('_')}`;
                const finalPrice = Number(product.newPrice) + extrasPrice;

                setCart(prev => {
                    const existing = prev.find(i => i.cartItemId === cartItemId);
                    if (existing) {
                        return prev.map(i => i.cartItemId === cartItemId ? { ...i, qty: i.qty + 1 } : i);
                    }
                    return [...prev, { ...product, cartItemId, name: product.name + extrasText, newPrice: finalPrice, qty: 1 }];
                });
                showToast(`${product.name} savatga qo'shildi!`);
            };

            const updateQty = (cartItemId, delta) => {
                SoundFX.play('tick');
                if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
                setCart(prev => prev.map(i => {
                    if (i.cartItemId === cartItemId) {
                        const newQ = i.qty + delta;
                        return newQ > 0 ? { ...i, qty: newQ } : null;
                    }
                    return i;
                }).filter(Boolean));
            };

            const toggleExtra = (ex) => {
                SoundFX.play('tick');
                setSelectedExtras(prev => prev.some(e => e.id === ex.id) ? prev.filter(e => e.id !== ex.id) : [...prev, ex]);
            };

            const totalAmount = cart.reduce((s, i) => s + (i.newPrice * i.qty), 0);
            const totalItems = cart.reduce((s, i) => s + i.qty, 0);

            const submitOrder = async (e) => {
                e.preventDefault();
                if (!customerLocation.trim() || cart.length === 0) return;
                setSubmitting(true);
                const orderObj = {
                    id: Math.floor(1000 + Math.random() * 9000),
                    telegramId: String(tgUser.id),
                    name: tgUser.first_name,
                    phone: customerPhone,
                    location: customerLocation,
                    totalAmount,
                    status: "Kutilmoqda",
                    items: cart.map(i => ({ id: i.id, name: i.name, qty: i.qty, price: i.newPrice }))
                };

                try {
                    await fetch('/api/orders', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(orderObj)
                    });
                } catch (err) {}

                SoundFX.play('tick');
                if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                setUserOrders(prev => [orderObj, ...prev]);
                setAdminOrders(prev => [orderObj, ...prev]);
                setCart([]);
                setSubmitting(false);
                setSuccessOrder(true);
                setTimeout(() => { setSuccessOrder(false); setIsCartOpen(false); }, 2800);
            };

            const formatPrice = (p) => Number(p).toLocaleString('uz-UZ') + " so'm";

            if (viewMode === 'admin') {
                return (
                    <div className="min-h-screen bg-[#fcfbf9] text-[#111] p-4 sm:p-8 max-w-[1150px] mx-auto">
                        <div className="gold-card rounded-3xl p-6 mb-6 flex flex-wrap items-center justify-between gap-4">
                            <div>
                                <span className="text-[10px] text-[#c5a059] font-bold uppercase tracking-widest block">LUXURY ADMIN PANEL</span>
                                <h1 className="font-serif-lux text-3xl font-bold">THE FAST FOOD // OS</h1>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={() => setAdminTab('orders')} className={`px-4 py-2.5 rounded-xl text-xs font-bold ${adminTab === 'orders' ? 'btn-gold text-white' : 'bg-gray-100'}`}>
                                    Buyurtmalar ({adminOrders.length})
                                </button>
                                <button onClick={() => setAdminTab('add')} className={`px-4 py-2.5 rounded-xl text-xs font-bold ${adminTab === 'add' ? 'btn-gold text-white' : 'bg-gray-100'}`}>
                                    + Yangi Taom
                                </button>
                                <button onClick={() => setViewMode('client')} className="px-4 py-2.5 rounded-xl text-xs font-bold bg-gray-200">
                                    ← Vitrinaga
                                </button>
                            </div>
                        </div>

                        {adminTab === 'add' ? (
                            <div className="gold-card rounded-3xl p-6">
                                <h2 className="font-serif-lux text-2xl font-bold mb-4">Yangi Taom Qo'shish</h2>
                                <form onSubmit={async (e) => {
                                    e.preventDefault();
                                    const created = {
                                        ...newProd,
                                        id: Date.now(),
                                        oldPrice: Number(newProd.oldPrice),
                                        newPrice: Number(newProd.newPrice),
                                        badge: "YANGI 🔥",
                                        prepTime: "12 daq",
                                        kcal: "720 KCAL"
                                    };
                                    try {
                                        await fetch('/api/admin/products', {
                                            method: 'POST',
                                            headers: {'Content-Type': 'application/json'},
                                            body: JSON.stringify(created)
                                        });
                                    } catch (err) {}
                                    setProducts(prev => [created, ...prev]);
                                    setNewProd({ name: '', description: '', image: '', oldPrice: '', newPrice: '', category: 'Burgerlar' });
                                    showToast("Taom qo'shildi!");
                                }} className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <input type="text" placeholder="Taom Nomi" value={newProd.name} onChange={e => setNewProd({...newProd, name: e.target.value})} className="p-3.5 rounded-xl border border-[#c5a059]/30 text-xs bg-white" required />
                                    <select value={newProd.category} onChange={e => setNewProd({...newProd, category: e.target.value})} className="p-3.5 rounded-xl border border-[#c5a059]/30 text-xs font-bold bg-white">
                                        <option value="Burgerlar">Burgerlar</option>
                                        <option value="Hot-Doglar">Hot-Doglar</option>
                                        <option value="Lavash">Lavash</option>
                                        <option value="Pitsa">Pitsa</option>
                                        <option value="Sneklar">Sneklar</option>
                                        <option value="Ichimliklar">Ichimliklar</option>
                                    </select>
                                    <input type="number" placeholder="Eski Narxi" value={newProd.oldPrice} onChange={e => setNewProd({...newProd, oldPrice: e.target.value})} className="p-3.5 rounded-xl border border-[#c5a059]/30 text-xs bg-white" required />
                                    <input type="number" placeholder="Yangi Narxi" value={newProd.newPrice} onChange={e => setNewProd({...newProd, newPrice: e.target.value})} className="p-3.5 rounded-xl border border-[#c5a059]/30 text-xs bg-white" required />
                                    <input type="url" placeholder="Rasm URL" value={newProd.image} onChange={e => setNewProd({...newProd, image: e.target.value})} className="sm:col-span-2 p-3.5 rounded-xl border border-[#c5a059]/30 text-xs bg-white" required />
                                    <textarea placeholder="Ta'rifi..." value={newProd.description} onChange={e => setNewProd({...newProd, description: e.target.value})} className="sm:col-span-2 p-3.5 rounded-xl border border-[#c5a059]/30 text-xs bg-white" rows="3" required />
                                    <button type="submit" className="sm:col-span-2 btn-gold py-4 rounded-xl text-xs font-extrabold uppercase">Saqlash</button>
                                </form>
                            </div>
                        ) : (
                            <div className="space-y-3">
                                {adminOrders.length === 0 ? (
                                    <div className="gold-card rounded-3xl p-12 text-center text-gray-400 text-xs">Buyurtmalar yo'q</div>
                                ) : adminOrders.map(o => (
                                    <div key={o.id} className="gold-card rounded-2xl p-5 flex items-center justify-between">
                                        <div>
                                            <span className="text-xs text-[#c5a059] font-bold">#{o.id} — {o.name} ({o.phone})</span>
                                            <p className="text-xs text-gray-600 mt-1">📍 {o.location}</p>
                                        </div>
                                        <div className="text-right">
                                            <span className="font-serif-lux text-lg font-bold">{formatPrice(o.totalAmount)}</span>
                                            <span className="block text-[10px] text-emerald-600 font-bold">{o.status}</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-36 relative">
                    {toast && (
                        <div className="fixed top-20 left-1/2 -translate-x-1/2 z-50 btn-gold px-6 py-3 rounded-full text-xs font-extrabold shadow-2xl flex items-center gap-2">
                            <span>✨</span><span>{toast}</span>
                        </div>
                    )}

                    {/* LUXURY HEADER */}
                    <header className="sticky top-0 z-30 bg-[#fcfbf9]/90 backdrop-blur-xl border-b border-[#c5a059]/20">
                        <div className="max-w-[1240px] mx-auto px-4 h-20 flex items-center justify-between gap-2">
                            <div className="flex items-center gap-3">
                                <div className="w-11 h-11 rounded-2xl btn-gold flex items-center justify-center font-serif-lux font-bold text-xl shadow-lg">
                                    FF
                                </div>
                                <div>
                                    <span className="font-serif-lux text-2xl font-bold tracking-wide gold-gradient-text block">THE FAST FOOD</span>
                                    <span className="text-[10px] text-gray-500 font-semibold tracking-widest uppercase">PREMIUM GOURMET OS</span>
                                </div>
                            </div>

                            <div className="flex items-center gap-2">
                                {(String(tgUser.id) === ADMIN_TELEGRAM_ID || isAdminAuthed) && (
                                    <button onClick={() => { SoundFX.play('tick'); setViewMode('admin'); fetchAdminData(); }} className="btn-gold px-4 py-2.5 rounded-2xl text-xs font-extrabold uppercase">
                                        ⚙️ Admin OS
                                    </button>
                                )}
                            </div>
                        </div>
                    </header>

                    {/* HERO BANNER */}
                    <section className="max-w-[1240px] mx-auto px-4 pt-6 pb-2">
                        <div className="relative w-full h-[340px] rounded-[32px] overflow-hidden gold-card flex items-end p-8">
                            <img src="https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&w=1200&q=90" className="absolute inset-0 w-full h-full object-cover brightness-90" />
                            <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-black/25 to-transparent" />
                            <div className="relative z-10 text-white space-y-2 max-w-lg">
                                <span className="bg-[#c5a059] text-white text-[10px] font-extrabold uppercase px-3 py-1 rounded-full tracking-wider">100% MARMAR MOL GO'SHTI</span>
                                <h1 className="font-serif-lux text-3xl sm:text-4xl font-bold leading-tight">Eng Sersuv Burgerlar & Gril Taomlari</h1>
                                <p className="text-xs text-gray-200">Hashamatli retseptlar asosida tayyorlangan eksklyuziv ta'm.</p>
                            </div>
                        </div>
                    </section>

                    {/* CATEGORY TABS */}
                    <section className="max-w-[1240px] mx-auto px-4 pt-6 sticky top-20 z-20 bg-[#fcfbf9]/95 backdrop-blur-md pb-4">
                        <div className="flex items-center gap-2.5 overflow-x-auto no-scrollbar py-1">
                            {categories.map(cat => {
                                const active = activeCategory === cat;
                                return (
                                    <button
                                        key={cat}
                                        onClick={() => { SoundFX.play('tick'); setActiveCategory(cat); }}
                                        className={`px-5 py-3 rounded-2xl text-xs font-bold shrink-0 transition-all ${
                                            active
                                                ? 'btn-gold shadow-lg scale-105'
                                                : 'gold-card text-gray-700 hover:text-black'
                                        }`}
                                    >
                                        {cat}
                                    </button>
                                );
                            })}
                        </div>
                    </section>

                    {/* MENU GRID */}
                    <section className="max-w-[1240px] mx-auto px-4 py-6">
                        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">
                            {filtered.map((product) => {
                                const qty = cart.filter(i => i.id === product.id).reduce((s, i) => s + i.qty, 0);
                                return (
                                    <div
                                        key={product.id}
                                        onClick={() => { SoundFX.play('tick'); setSelectedProduct(product); setSelectedExtras([]); }}
                                        className="gold-card rounded-[28px] p-3.5 cursor-pointer flex flex-col justify-between group"
                                    >
                                        <div>
                                            <div className="relative aspect-[1/0.95] rounded-[20px] overflow-hidden bg-gray-100 mb-3">
                                                <img src={product.image} alt={product.name} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                                                <span className="absolute top-2.5 left-2.5 bg-black/70 backdrop-blur-md text-[#f3e5ab] text-[9px] font-bold uppercase px-2.5 py-1 rounded-full border border-[#c5a059]/40">
                                                    {product.badge}
                                                </span>
                                            </div>
                                            <h3 className="font-serif-lux text-lg font-bold text-gray-900 group-hover:text-[#8c6d33] transition-colors line-clamp-1">{product.name}</h3>
                                            <p className="text-[11px] text-gray-500 mt-1 line-clamp-2 leading-relaxed">{product.description}</p>
                                        </div>

                                        <div className="flex items-center justify-between pt-4 mt-3 border-t border-[#c5a059]/15">
                                            <span className="font-serif-lux text-base font-bold text-gray-900">{formatPrice(product.newPrice)}</span>
                                            <button
                                                onClick={(e) => addToCart(product, [], e)}
                                                className={`h-9 px-4 rounded-xl font-bold text-xs transition-all ${
                                                    qty > 0 ? 'btn-gold' : 'bg-gray-100 hover:bg-[#c5a059] hover:text-white text-gray-800'
                                                }`}
                                            >
                                                {qty > 0 ? `${qty}x qo'shildi` : '+ QO\'SHISH'}
                                            </button>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </section>

                    {/* FIXED BOTTOM DOCK (BUYURTMALAR & SAVAT) */}
                    <div className="fixed bottom-4 left-4 right-4 z-40 max-w-[820px] mx-auto">
                        <div className="gold-card rounded-[28px] p-3 flex items-center gap-3 backdrop-blur-xl bg-white/95">
                            <button
                                onClick={() => { SoundFX.play('tick'); fetch(`/api/orders/${tgUser.id}`).then(r=>r.json()).then(d=>setUserOrders(Array.isArray(d)?d:[])).catch(()=>{}); setIsOrdersOpen(true); }}
                                className="px-5 py-4 rounded-2xl bg-gray-100 hover:bg-gray-200 text-gray-900 text-xs font-bold flex items-center gap-2 shrink-0 border border-[#c5a059]/20"
                            >
                                <span>📦</span>
                                <span>Buyurtmalar</span>
                            </button>

                            <button
                                onClick={() => { SoundFX.play('tick'); setIsCartOpen(true); }}
                                className="flex-1 btn-gold py-4 px-6 rounded-2xl flex items-center justify-between shadow-xl"
                            >
                                <div className="flex items-center gap-2">
                                    <span className="text-base">🛒</span>
                                    <span className="text-xs font-extrabold uppercase tracking-wider">SAVAT</span>
                                    {totalItems > 0 && (
                                        <span className="bg-white text-[#8c6d33] px-2 py-0.5 rounded-full text-[10px] font-bold">
                                            {totalItems}
                                        </span>
                                    )}
                                </div>
                                <span className="font-serif-lux text-base font-bold">{formatPrice(totalAmount)}</span>
                            </button>
                        </div>
                    </div>

                    {/* DISH CUSTOMIZATION MODAL */}
                    {selectedProduct && (
                        <div onClick={() => setSelectedProduct(null)} className="fixed inset-0 z-50 bg-black/60 backdrop-blur-md flex items-end sm:items-center justify-center p-0 sm:p-4">
                            <div onClick={e => e.stopPropagation()} className="bg-white w-full max-w-lg rounded-t-[34px] sm:rounded-[34px] p-6 max-h-[90vh] overflow-y-auto border border-[#c5a059]/30 shadow-2xl">
                                <div className="relative h-56 w-full rounded-[24px] overflow-hidden mb-4 bg-gray-100">
                                    <img src={selectedProduct.image} className="w-full h-full object-cover" />
                                    <button onClick={() => setSelectedProduct(null)} className="absolute top-3 right-3 w-9 h-9 rounded-full bg-black/70 text-white font-bold">✕</button>
                                </div>

                                <h3 className="font-serif-lux text-2xl font-bold text-gray-900 mb-1">{selectedProduct.name}</h3>
                                <p className="text-xs text-gray-600 mb-5 leading-relaxed">{selectedProduct.description}</p>

                                <div className="space-y-2 mb-6">
                                    <span className="text-[10px] font-bold text-gray-400 uppercase tracking-widest block mb-2">+ QO'SHIMCHALAR:</span>
                                    {EXTRAS.map(ex => {
                                        const checked = selectedExtras.some(e => e.id === ex.id);
                                        return (
                                            <div
                                                key={ex.id}
                                                onClick={() => toggleExtra(ex)}
                                                className={`p-3.5 rounded-2xl border cursor-pointer flex items-center justify-between transition ${
                                                    checked ? 'border-[#c5a059] bg-[#f3e5ab]/20' : 'border-gray-200 bg-gray-50'
                                                }`}
                                            >
                                                <span className="text-xs font-bold text-gray-800">{ex.name}</span>
                                                <span className="text-xs font-bold text-[#8c6d33]">+{formatPrice(ex.price)}</span>
                                            </div>
                                        );
                                    })}
                                </div>

                                <div className="flex items-center justify-between pt-4 border-t border-gray-100">
                                    <div>
                                        <span className="text-[10px] text-gray-400 uppercase block font-semibold">Jami Narx</span>
                                        <span className="font-serif-lux text-xl font-bold text-gray-900">
                                            {formatPrice(Number(selectedProduct.newPrice) + selectedExtras.reduce((s, e) => s + e.price, 0))}
                                        </span>
                                    </div>
                                    <button
                                        onClick={(e) => {
                                            addToCart(selectedProduct, selectedExtras, e);
                                            setSelectedProduct(null);
                                        }}
                                        className="btn-gold px-7 py-4 rounded-2xl text-xs font-extrabold uppercase tracking-wider shadow-lg"
                                    >
                                        + Savatga Qo'shish
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* CHECKOUT VAULT (SAVAT) */}
                    {isCartOpen && (
                        <div onClick={() => setIsCartOpen(false)} className="fixed inset-0 z-50 bg-black/60 backdrop-blur-md flex justify-end">
                            <div onClick={e => e.stopPropagation()} className="bg-white w-full max-w-md h-full p-6 flex flex-col justify-between overflow-y-auto shadow-2xl border-l border-[#c5a059]/30">
                                <div>
                                    <div className="flex items-center justify-between pb-4 border-b border-gray-100">
                                        <div>
                                            <span className="text-[10px] text-[#c5a059] font-bold uppercase tracking-widest">RASMIYLASHTIRISH</span>
                                            <h2 className="font-serif-lux text-2xl font-bold">SAVATCHA</h2>
                                        </div>
                                        <button onClick={() => setIsCartOpen(false)} className="w-9 h-9 rounded-full bg-gray-100 text-gray-800 font-bold">✕</button>
                                    </div>

                                    {successOrder ? (
                                        <div className="py-20 text-center space-y-3">
                                            <div className="w-20 h-20 rounded-full btn-gold flex items-center justify-center text-3xl mx-auto text-white font-bold shadow-xl">✓</div>
                                            <h3 className="font-serif-lux text-2xl font-bold">BUYURTMA QABUL QILINDI!</h3>
                                            <p className="text-xs text-gray-500">Kuryerimiz tez orada siz bilan bog'lanadi.</p>
                                        </div>
                                    ) : cart.length === 0 ? (
                                        <p className="text-center py-20 text-xs text-gray-400 font-semibold">SAVATCHANGIZ BO'SH</p>
                                    ) : (
                                        <div className="mt-4 space-y-3">
                                            {cart.map(item => (
                                                <div key={item.cartItemId} className="flex items-center gap-3 p-3 rounded-2xl bg-gray-50 border border-gray-100">
                                                    <img src={item.image} className="w-14 h-14 rounded-xl object-cover shrink-0" />
                                                    <div className="flex-1 min-w-0">
                                                        <h4 className="text-xs font-bold text-gray-900 truncate">{item.name}</h4>
                                                        <p className="font-serif-lux text-sm font-bold text-[#8c6d33] mt-0.5">{formatPrice(item.newPrice)}</p>
                                                    </div>
                                                    <div className="flex items-center gap-2 bg-white border border-gray-200 px-3 py-1 rounded-xl shadow-sm">
                                                        <button onClick={() => updateQty(item.cartItemId, -1)} className="font-bold text-sm">−</button>
                                                        <span className="text-xs font-bold w-4 text-center">{item.qty}</span>
                                                        <button onClick={() => updateQty(item.cartItemId, 1)} className="font-bold text-sm">+</button>
                                                    </div>
                                                </div>
                                            ))}

                                            <form onSubmit={submitOrder} className="pt-4 space-y-4">
                                                <div>
                                                    <label className="block text-[10px] font-bold text-gray-500 uppercase mb-1">Telefon raqam</label>
                                                    <input type="tel" required value={customerPhone} onChange={e => setCustomerPhone(e.target.value)} className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3.5 text-xs font-semibold focus:outline-none focus:border-[#c5a059]" />
                                                </div>

                                                <div>
                                                    <div className="flex items-center justify-between mb-1">
                                                        <label className="text-[10px] font-bold text-gray-500 uppercase">Yetkazib berish manzili</label>
                                                        <button type="button" onClick={detectGpsAddress} className="text-[10px] font-bold text-[#8c6d33] hover:underline">
                                                            📍 GPS orqali aniqlash
                                                        </button>
                                                    </div>
                                                    <textarea required rows="2" value={customerLocation} onChange={e => setCustomerLocation(e.target.value)} placeholder="Toshkent sh., ko'cha, uy..." className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3.5 text-xs focus:outline-none focus:border-[#c5a059]" />
                                                </div>

                                                <div className="p-4 rounded-2xl bg-[#f3e5ab]/15 border border-[#c5a059]/30 flex justify-between items-center">
                                                    <span className="text-xs font-semibold text-gray-700">Jami to'lov:</span>
                                                    <span className="font-serif-lux text-xl font-bold text-[#8c6d33]">{formatPrice(totalAmount)}</span>
                                                </div>

                                                <button type="submit" disabled={submitting} className="w-full btn-gold py-4 rounded-2xl text-xs font-extrabold uppercase tracking-widest shadow-xl">
                                                    {submitting ? "Yuborilmoqda..." : "Buyurtmani Tasdiqlash 🔥"}
                                                </button>
                                            </form>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* BUYURTMALAR TARIXI */}
                    {isOrdersOpen && (
                        <div onClick={() => setIsOrdersOpen(false)} className="fixed inset-0 z-50 bg-black/60 backdrop-blur-md flex justify-start">
                            <div onClick={e => e.stopPropagation()} className="bg-white w-full max-w-md h-full p-6 overflow-y-auto shadow-2xl border-r border-[#c5a059]/30">
                                <div className="flex items-center justify-between pb-4 border-b border-gray-100">
                                    <h2 className="font-serif-lux text-2xl font-bold">BUYURTMALARIM</h2>
                                    <button onClick={() => setIsOrdersOpen(false)} className="w-9 h-9 rounded-full bg-gray-100 text-gray-800 font-bold">✕</button>
                                </div>
                                <div className="mt-4 space-y-3">
                                    {userOrders.length === 0 ? (
                                        <p className="text-center py-20 text-xs text-gray-400 font-semibold">FAOL BUYURTMALAR YO'Q</p>
                                    ) : userOrders.map(o => (
                                        <div key={o.id} className="p-4 rounded-2xl bg-gray-50 border border-gray-200 space-y-1">
                                            <div className="flex justify-between items-center">
                                                <span className="text-xs font-bold text-[#8c6d33]">#{o.id}</span>
                                                <span className="text-[10px] font-bold text-emerald-600">{o.status}</span>
                                            </div>
                                            <p className="text-xs text-gray-600">📍 {o.location}</p>
                                            <p className="font-serif-lux text-base font-bold text-gray-900 pt-1">{formatPrice(o.totalAmount)}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
