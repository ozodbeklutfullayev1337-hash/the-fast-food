        .perspective-stage {

        }

        .obsidian-slab {

            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.95), inset 0 1px 1px rgba(255, 255, 255, 0.15);

        }

        .btn-lava {
            background: linear-gradient(135deg, #ff7b00 0%, #ff3b00 55%, #b81d00 100%);
            color: #ffffff;
            box-shadow: 0 12px 30px -6px rgba(255, 59, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.6);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .btn-lava:active { transform: scale(0.93); }

        @keyframes bunBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-2.5px); }
        }
        @keyframes flameFlicker {
            0%, 100% { transform: scaleY(1) rotate(-2deg); opacity: 0.9; }
            50% { transform: scaleY(1.18) rotate(2deg); opacity: 1; }
        }
        @keyframes spinSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes bubbleFloat {
            0% { transform: translateY(3px); opacity: 0.3; }
            50% { opacity: 1; }
            100% { transform: translateY(-4px); opacity: 0; }
        }

        .anim-bun { animation: bunBounce 2.2s infinite ease-in-out; }
        .anim-flame { animation: flameFlicker 1.4s infinite ease-in-out; transform-origin: bottom center; }
        .anim-spin { animation: spinSlow 14s infinite linear; transform-origin: center; }
        .anim-bubble { animation: bubbleFloat 1.8s infinite ease-in-out; }

        .coverflow-card {
            transition: all 0.55s cubic-bezier(0.16, 1, 0.3, 1);
            transform-style: preserve-3d;
            will-change: transform, opacity;
        }

        @keyframes cardReveal3D {
            0% { opacity: 0; transform: perspective(900px) translateY(45px) rotateX(16deg) scale(0.92); }
            100% { opacity: 1; transform: perspective(900px) translateY(0) rotateX(0deg) scale(1); }
        }
        .menu-card-anim { animation: cardReveal3D 0.55s cubic-bezier(0.16, 1, 0.3, 1) backwards; }

        @keyframes flyToDock {
            0% { transform: scale(1) translate(0, 0); opacity: 1; }
            70% { opacity: 1; }
            100% { transform: scale(0.2) translate(var(--tx), var(--ty)); opacity: 0; }
        }
        .flying-orb {
            position: fixed;
            z-index: 9999;
            pointer-events: none;
            animation: flyToDock 0.65s cubic-bezier(0.2, 0.85, 0.4, 1) forwards;
        }

        .photo-vignette {

</head>

        const SoundFX = {
            play(type = 'tick') {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const now = ctx.currentTime;
                    if (type === 'tick') {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(240, now);
                        osc.frequency.exponentialRampToValueAtTime(60, now + 0.035);
                        gain.gain.setValueAtTime(0.1, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now);
                        osc.stop(now + 0.04);
                    } else if (type === 'whoosh') {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(120, now);
                        osc.frequency.exponentialRampToValueAtTime(340, now + 0.09);
                        gain.gain.setValueAtTime(0.08, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now);
                        osc.stop(now + 0.11);
                    } else if (type === 'coin') {
                        [587.33, 880].forEach((freq, i) => {
                            const osc = ctx.createOscillator();
                            const gain = ctx.createGain();
                            osc.type = 'sine';
                            osc.frequency.setValueAtTime(freq, now + i * 0.055);
                            gain.gain.setValueAtTime(0.12, now + i * 0.055);
                            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.055 + 0.18);
                            osc.connect(gain);
                            gain.connect(ctx.destination);
                            osc.start(now + i * 0.055);
                            osc.stop(now + i * 0.055 + 0.2);
                        });
                    }
                } catch (e) {}
            }
        };

        function SpatialDishSlab({ product, index, qty, onSelect, onQuickAdd, formatPrice }) {
            const slabRef = useRef(null);
            const [tilt, setTilt] = useState("perspective(900px) rotateX(0deg) rotateY(0deg)");
            const [glare, setGlare] = useState({ x: 50, y: 50, opacity: 0 });

            const handlePointerMove = (e) => {
                if (!slabRef.current) return;
                const rect = slabRef.current.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const x = clientX - rect.left;
                const y = clientY - rect.top;
                const rx = ((y - rect.height / 2) / (rect.height / 2)) * -10;
                const ry = ((x - rect.width / 2) / (rect.width / 2)) * 10;
                setTilt(`perspective(900px) rotateX(${rx.toFixed(1)}deg) rotateY(${ry.toFixed(1)}deg) scale3d(1.02, 1.02, 1.02)`);
                setGlare({ x: (x / rect.width) * 100, y: (y / rect.height) * 100, opacity: 1 });
            };

            const handlePointerLeave = () => {
                setTilt("perspective(900px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)");
                setGlare(prev => ({ ...prev, opacity: 0 }));
            };

            return (
                <div
                    ref={slabRef}
                    onMouseMove={handlePointerMove}
                    onMouseLeave={handlePointerLeave}
                    onTouchMove={handlePointerMove}
                    onTouchEnd={handlePointerLeave}
                    onClick={() => { SoundFX.play('tick'); onSelect(product); }}
                    style={{ transform: tilt, animationDelay: `${index * 45}ms` }}
                    className={`menu-card-anim obsidian-slab rounded-[28px] p-3 cursor-pointer flex flex-col justify-between relative group overflow-hidden transition-transform duration-200 ${qty > 0 ? 'lava-border-glow' : ''}`}
                >
                    <div style={{ opacity: glare.opacity, background: `radial-gradient(260px circle at ${glare.x}% ${glare.y}%, rgba(255, 130, 50, 0.18), transparent 65%)` }} className="pointer-events-none absolute inset-0 z-20 transition-opacity duration-300" />
                    <div>
                        <div className="relative aspect-[1/0.92] rounded-[22px] overflow-hidden bg-[#070709] mb-3 border border-white/[0.07]">
                            <div className="absolute inset-0 photo-vignette" />
                            <img src={product.image} alt={product.name} loading="lazy" className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700 ease-out" />
                            <div className="absolute inset-0 bg-gradient-to-t from-[#090a0e] via-transparent to-black/25" />
                            <div className="absolute top-2.5 left-2.5 right-2.5 flex items-center justify-between">
                                <span className="bg-black/75 backdrop-blur-md border border-[#ff5500]/50 text-[#ff9e00] text-[9px] font-extrabold uppercase px-2.5 py-1 rounded-full tracking-wider">
                                    {product.badge}
                                </span>
                                <span className="font-mono-tech text-[9px] text-white/60 bg-black/60 px-2 py-0.5 rounded-full">
                                    {product.code || `FF-0${product.id}`}
                                </span>
                            </div>
                            <div className="absolute bottom-2 left-2.5 right-2.5 flex items-center justify-between text-[10px] font-mono-tech text-white/80">
                                <span className="bg-black/60 backdrop-blur-md px-2 py-0.5 rounded-md border border-white/10">⏱ {product.prepTime}</span>
                                <span className="text-[#ff9e00] font-bold">{product.kcal || "680 KCAL"}</span>
                            </div>
                        </div>
                        <div className="px-1">
                            <p className="font-mono-tech text-[9px] text-[#ff7b00] uppercase tracking-wider truncate">{product.tagline || product.category}</p>
                            <h3 className="font-syne text-[14.5px] font-extrabold text-white group-hover:text-[#ff9e00] transition-colors leading-tight line-clamp-1 mt-0.5">{product.name}</h3>
                            <p className="text-[11px] text-white/50 mt-1 line-clamp-2 leading-relaxed">{product.description}</p>
                        </div>
                    </div>
                    <div className="flex items-center justify-between pt-3 mt-3 border-t border-white/[0.07] px-1">
                        <div>
                            {product.oldPrice > product.newPrice && (
                                <span className="block font-mono-tech text-[9.5px] text-white/30 line-through">{formatPrice(product.oldPrice)}</span>
                            )}

                        </div>
                        <button onClick={(e) => onQuickAdd(product, [], e)} className={`h-10 px-3.5 rounded-2xl flex items-center justify-center font-mono-tech font-bold text-xs transition-all ${qty > 0 ? 'btn-lava scale-105' : 'bg-white/[0.08] hover:bg-[#ff5500] text-white border border-white/15'}`}>
                            {qty > 0 ? `${qty}x` : '+ QO\'SHISH'}
                        </button>
                    </div>
                </div>
            );
        }

                const ctx = canvas.getContext('2d');
                let w = canvas.width = window.innerWidth;
                let h = canvas.height = window.innerHeight;

                const embers = Array.from({ length: 28 }, () => ({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    r: Math.random() * 2.2 + 0.5,
                    vy: -(Math.random() * 0.6 + 0.2),
                    vx: (Math.random() - 0.5) * 0.4,
                    alpha: Math.random() * 0.55 + 0.15,
                    hue: Math.random() > 0.5 ? '#ff3b00' : '#ff9e00'
                }));

                let raf;
                const draw = () => {
                    ctx.clearRect(0, 0, w, h);
                    embers.forEach(e => {
                        e.x += e.vx;
                        e.y += e.vy;
                        if (e.y < -10) {
                            e.y = h + 10;
                            e.x = Math.random() * w;
                        }
                        ctx.beginPath();
                        ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
                        ctx.fillStyle = e.hue;
                        ctx.globalAlpha = e.alpha;
                        ctx.shadowBlur = 14;
                        ctx.shadowColor = e.hue;
                        ctx.fill();

                    raf = requestAnimationFrame(draw);

                        <div className="flex items-center justify-between px-2 mb-3">
                            <div>
                                <span className="font-mono-tech text-[10px] text-[#ff5500] uppercase tracking-widest block">● HIT TAVSIVALAR</span>
                                <h2 className="font-syne text-xl sm:text-2xl font-extrabold text-white">ENG SERSUV BURGERLAR</h2>
                            </div>
                            <div className="flex items-center gap-1.5">
                                <button onClick={() => { SoundFX.play('whoosh'); setHeroIndex(prev => (prev - 1 + featuredItems.length) % featuredItems.length); }} className="w-9 h-9 rounded-xl obsidian-slab flex items-center justify-center text-white hover:border-[#ff5500]">←</button>
                                <button onClick={() => { SoundFX.play('whoosh'); setHeroIndex(prev => (prev + 1) % featuredItems.length); }} className="w-9 h-9 rounded-xl obsidian-slab flex items-center justify-center text-white hover:border-[#ff5500]">→</button>
                            </div>
                        </div>

                        <div className="perspective-stage relative h-[330px] sm:h-[360px] flex items-center justify-center">
                            {featuredItems.map((item, idx) => {
                                const total = featuredItems.length;
                                let offset = idx - heroIndex;
                                if (offset > total / 2) offset -= total;
                                if (offset < -total / 2) offset += total;
                                const isCenter = offset === 0;
                                const absOffset = Math.abs(offset);
                                const translateX = offset * 62;
                                const translateZ = isCenter ? 0 : -150 * absOffset;
                                const rotateY = offset * -28;
                                const opacity = absOffset > 1 ? 0 : isCenter ? 1 : 0.42;
                                const zIndex = 20 - absOffset * 5;

                                return (
                                    <div
                                        key={item.id}
                                        onClick={() => {
                                            SoundFX.play('whoosh');
                                            if (isCenter) {
                                                setSelectedProduct(item);
                                                setSelectedExtras([]);
                                            } else {
                                                setHeroIndex(idx);
                                            }
                                        }}
                                        style={{ transform: `translateX(${translateX}%) translateZ(${translateZ}px) rotateY(${rotateY}deg)`, opacity, zIndex }}
                                        className={`coverflow-card absolute w-[84%] sm:w-[460px] h-[305px] sm:h-[330px] rounded-[32px] obsidian-slab overflow-hidden cursor-pointer ${isCenter ? 'lava-border-glow' : ''}`}
                                    >
                                        <img src={item.image} alt={item.name} className="w-full h-full object-cover" />
                                        <div className="absolute inset-0 bg-gradient-to-t from-[#040406] via-[#040406]/45 to-transparent" />
                                        <div className="absolute top-4 left-4 right-4 flex items-center justify-between">
                                            <span className="btn-lava text-[10px] font-mono-tech font-bold uppercase px-3 py-1 rounded-full">{item.badge}</span>
                                            <span className="bg-black/70 backdrop-blur-md border border-white/15 text-white font-mono-tech text-[10px] px-2.5 py-1 rounded-full">🔥 {item.kcal}</span>
                                        </div>
                                        <div className="absolute bottom-4 left-4 right-4 flex items-end justify-between gap-3">
                                            <div>
                                                <p className="font-mono-tech text-[10px] text-[#ff9e00] uppercase">{item.tagline}</p>
                                                <h3 className="font-syne text-xl sm:text-2xl font-extrabold text-white leading-tight mt-0.5">{item.name}</h3>
                                                <div className="flex items-center gap-2 mt-1">
                                                    <span className="font-syne text-lg font-extrabold text-[#ff9e00]">{formatPrice(item.newPrice)}</span>
                                                    <span className="font-mono-tech text-xs text-white/35 line-through">{formatPrice(item.oldPrice)}</span>
                                                </div>
                                            </div>
                                            <button onClick={(e) => addToCart(item, [], e)} className="btn-lava px-5 py-3.5 rounded-2xl font-mono-tech text-xs font-bold shrink-0">+ BUYURTMA</button>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </section>

                    {/* CATEGORY DOCK & SEARCH */}
                    <section className="max-w-[1240px] mx-auto px-3 pt-4 sticky top-16 z-20 bg-gradient-to-b from-[#040406] via-[#040406]/95 to-transparent pb-3">
                        <div className="flex flex-col sm:flex-row gap-2.5 items-stretch sm:items-center justify-between">
                            <div className="flex items-center gap-2 overflow-x-auto no-scrollbar py-1">
                                {categories.map(cat => {
                                    const active = activeCategory === cat;
                                    return (
                                        <button key={cat} onClick={() => { SoundFX.play('tick'); setActiveCategory(cat); }} className={`px-4 py-2.5 rounded-2xl text-xs font-syne font-bold shrink-0 flex items-center gap-2 transition-all duration-300 ${active ? 'btn-lava scale-105' : 'obsidian-slab text-white/70 hover:text-white'}`}>
                                            <AnimatedCategoryIcon category={cat} active={active} />
                                            <span>{cat}</span>
                                        </button>
                                    );
                                })}
                            </div>

                            <div className="relative sm:w-64">
                                <input type="text" value={search} onChange={e => setSearch(e.target.value)} placeholder="Taom nomi..." className="w-full obsidian-slab rounded-2xl py-2.5 pl-9 pr-4 text-xs text-white placeholder-white/35 focus:outline-none focus:border-[#ff5500]" />
                                <span className="absolute left-3 top-1/2 -translate-y-1/2 text-white/40 text-xs">⌕</span>
                            </div>
                        </div>
                    </section>

                    {/* MENU GRID */}
                    <section className="max-w-[1240px] mx-auto px-3 py-3">
                        <div key={activeCategory} className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3.5 sm:gap-5">
                            {filtered.map((product, idx) => {
                                const qty = cart.filter(i => i.id === product.id).reduce((s, i) => s + i.qty, 0);
                                return (
                                    <SpatialDishSlab
                                        key={product.id}
                                        index={idx}
                                        product={product}
                                        qty={qty}
                                        onSelect={(p) => { setSelectedProduct(p); setSelectedExtras([]); }}
                                        onQuickAdd={addToCart}
                                        formatPrice={formatPrice}
                                    />
                                );
                            })}
                        </div>
                    </section>

                    {/* DOIMIY QULAY VA KATTA PASTGI PANELI (BUYURTMALAR VA SAVAT) */}
                    <div className="fixed bottom-3 left-3 right-3 z-40 max-w-[820px] mx-auto">
                        <div className="obsidian-slab lava-border-glow rounded-[26px] p-2.5 flex items-center gap-2.5">
                            <button onClick={() => { SoundFX.play('tick'); fetch(`/api/orders/${tgUser.id}`).then(r=>r.json()).then(d=>setUserOrders(Array.isArray(d)?d:[])).catch(()=>{}); setIsOrdersOpen(true); }} className="px-4 py-3.5 rounded-[20px] bg-white/[0.06] hover:bg-white/[0.12] border border-white/10 text-xs font-bold text-white flex items-center gap-2 shrink-0">
                                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping" />
                                <span>📦 Buyurtmalar</span>
                            </button>

                            <button onClick={() => { SoundFX.play('whoosh'); setIsCartOpen(true); }} className="flex-1 btn-lava py-3.5 px-5 rounded-[20px] flex items-center justify-between">
                                <div className="flex items-center gap-2.5">
                                    <span className="text-lg">🛒</span>
                                    <span className="font-syne text-xs sm:text-sm font-extrabold uppercase tracking-wider">SAVAT</span>
                                    {totalItems > 0 && (
                                        <span className="bg-black text-[#ff9e00] font-mono-tech px-2.5 py-0.5 rounded-full text-xs font-bold">{totalItems}</span>
                                    )}
                                </div>
                                <span className="font-syne text-xs sm:text-sm font-extrabold">{formatPrice(totalAmount)}</span>
                            </button>
                        </div>
                    </div>

                    {isBurgerLabOpen && (
                        <BurgerLabModal onClose={() => setIsBurgerLabOpen(false)} onAddCustom={addToCart} formatPrice={formatPrice} />
                    )}

                    {/* DISH CUSTOMIZATION SHEET */}
                    {selectedProduct && (
                        <div onClick={() => setSelectedProduct(null)} className="fixed inset-0 z-50 bg-black/85 backdrop-blur-2xl flex items-end sm:items-center justify-center p-0 sm:p-4">
                            <div onClick={e => e.stopPropagation()} className="obsidian-slab lava-border-glow w-full max-w-lg rounded-t-[34px] sm:rounded-[34px] overflow-hidden p-5 max-h-[90vh] overflow-y-auto">
                                <div className="relative h-60 w-full rounded-[24px] overflow-hidden mb-4 border border-white/15">
                                    <img src={selectedProduct.image} className="w-full h-full object-cover" />
                                    <div className="absolute inset-0 bg-gradient-to-t from-[#090a0e] via-transparent to-black/30" />
                                    <button onClick={() => setSelectedProduct(null)} className="absolute top-3 right-3 w-9 h-9 rounded-full bg-black/70 text-white font-bold border border-white/20">✕</button>
                                    <div className="absolute bottom-3 left-3 right-3 flex items-center justify-between">
                                        <span className="btn-lava text-[10px] font-mono-tech font-bold px-3 py-1 rounded-full">{selectedProduct.badge}</span>
                                        <span className="bg-black/75 backdrop-blur-md text-white font-mono-tech text-[10px] px-3 py-1 rounded-full border border-white/15">⏱ {selectedProduct.prepTime}</span>
                                    </div>
                                </div>

                                <h3 className="font-syne text-2xl font-extrabold text-white mt-0.5 mb-1.5">{selectedProduct.name}</h3>
                                <p className="text-xs text-white/65 mb-5 leading-relaxed">{selectedProduct.description}</p>

                                <div className="space-y-2 mb-6">
                                    <span className="font-mono-tech text-[10px] text-white/45 uppercase block mb-2">+ QO'SHIMCHALAR:</span>
                                    {EXTRAS.map(ex => {
                                        const checked = selectedExtras.some(e => e.id === ex.id);
                                        return (
                                            <div key={ex.id} onClick={() => toggleExtra(ex)} className={`p-3.5 rounded-2xl border cursor-pointer flex items-center justify-between transition ${checked ? 'border-[#ff5500] bg-[#ff5500]/15' : 'border-white/10 bg-white/[0.03]'}`}>
                                                <span className="text-xs font-bold text-white">{ex.name}</span>
                                                <span className="font-mono-tech text-xs font-bold text-[#ff9e00]">+{formatPrice(ex.price)}</span>
                                            </div>
                                        );
                                    })}
                                </div>

                                <div className="flex items-center justify-between pt-4 border-t border-white/10">
                                    <div>
                                        <span className="font-mono-tech text-[10px] text-white/45 block">JAMI NARX</span>
                                        <span className="font-syne text-xl font-extrabold text-white">{formatPrice(Number(selectedProduct.newPrice) + selectedExtras.reduce((s, e) => s + e.price, 0))}</span>
                                    </div>
                                    <button onClick={(e) => { addToCart(selectedProduct, selectedExtras, e); setSelectedProduct(null); }} className="btn-lava px-7 py-4 rounded-2xl text-xs font-extrabold uppercase tracking-wider">
                                        + Savatga Qo'shish
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* CHECKOUT VAULT */}
                    {isCartOpen && (
                        <div onClick={() => setIsCartOpen(false)} className="fixed inset-0 z-50 bg-black/85 backdrop-blur-2xl flex justify-end">
                            <div onClick={e => e.stopPropagation()} className="obsidian-slab w-full max-w-md h-full p-5 flex flex-col justify-between overflow-y-auto border-l border-[#ff5500]/30">
                                <div>
                                    <div className="flex items-center justify-between pb-4 border-b border-white/10">
                                        <div>
                                            <span className="font-mono-tech text-[10px] text-[#ff7b00] block">TEZKOR RASMIYLASHTIRISH</span>
                                            <h2 className="font-syne text-xl font-extrabold text-white">SAVATCHA</h2>
                                        </div>
                                        <button onClick={() => setIsCartOpen(false)} className="w-9 h-9 rounded-full bg-white/10 text-white">✕</button>
                                    </div>

                                    {successOrder ? (
                                        <div className="py-20 text-center space-y-3">
                                            <div className="w-20 h-20 rounded-full btn-lava flex items-center justify-center text-3xl mx-auto font-black">✓</div>
                                            <h3 className="font-syne text-2xl font-extrabold text-white">BUYURTMA QABUL QILINDI!</h3>
                                            <p className="text-xs text-white/60 max-w-xs mx-auto">Kuryerimiz tez orada siz bilan bog'lanadi.</p>
                                        </div>
                                    ) : cart.length === 0 ? (
                                        <p className="text-center py-20 text-xs text-white/40 font-mono-tech">SAVATCHANGIZ BO'SH</p>
                                    ) : (
                                        <div className="mt-4 space-y-3">
                                            {cart.map(item => (
                                                <div key={item.cartItemId} className="flex items-center gap-3 p-2.5 rounded-2xl bg-white/[0.04] border border-white/10">
                                                    <img src={item.image} className="w-14 h-14 rounded-xl object-cover shrink-0" />
                                                    <div className="flex-1 min-w-0">
                                                        <h4 className="text-xs font-bold text-white truncate">{item.name}</h4>
                                                        <p className="font-mono-tech text-xs text-[#ff9e00] font-bold mt-0.5">{formatPrice(item.newPrice)}</p>
                                                    </div>
                                                    <div className="flex items-center gap-2 bg-black/60 border border-white/15 px-2.5 py-1 rounded-xl">
                                                        <button onClick={() => updateQty(item.cartItemId, -1)} className="text-white font-bold">−</button>
                                                        <span className="font-mono-tech text-xs font-bold w-4 text-center">{item.qty}</span>
                                                        <button onClick={() => updateQty(item.cartItemId, 1)} className="text-white font-bold">+</button>
                                                    </div>
                                                </div>
                                            ))}

                                            <form onSubmit={submitOrder} className="pt-4 space-y-3.5">
                                                <div>
                                                    <label className="block font-mono-tech text-[10px] uppercase text-white/60 mb-1">Telefon raqam</label>
                                                    <input type="tel" required value={customerPhone} onChange={e => setCustomerPhone(e.target.value)} className="w-full bg-black/60 border border-white/15 rounded-xl p-3.5 text-xs font-bold text-white focus:outline-none focus:border-[#ff5500]" />
                                                </div>

                                                <div>
                                                    <div className="flex items-center justify-between mb-1">
                                                        <label className="font-mono-tech text-[10px] uppercase text-white/60">Yetkazib berish manzili</label>
                                                        <button type="button" onClick={detectGpsAddress} className="text-[10px] font-mono-tech font-bold text-[#ff9e00] hover:underline flex items-center gap-1">
                                                            {locatingGps ? "Aniqlanmoqda..." : "📍 GPS orqali aniqlash"}
                                                        </button>
                                                    </div>
                                                    <textarea required rows="2" value={customerLocation} onChange={e => setCustomerLocation(e.target.value)} placeholder="Masalan: Yunusobod, 4-kvartal..." className="w-full bg-black/60 border border-white/15 rounded-xl p-3.5 text-xs text-white focus:outline-none focus:border-[#ff5500]" />
                                                </div>

                                                <div className="p-4 rounded-2xl bg-white/[0.04] border border-white/10 flex justify-between items-center">
                                                    <span className="text-xs text-white/70">Jami to'lov:</span>
                                                    <span className="font-syne text-lg font-extrabold text-[#ff9e00]">{formatPrice(totalAmount)}</span>
                                                </div>

                                                <button type="submit" disabled={submitting} className="w-full btn-lava py-4 rounded-2xl text-xs font-extrabold uppercase tracking-widest">
                                                    {submitting ? "Yuborilmoqda..." : "Buyurtmani Tasdiqlash 🔥"}
                                                </button>
                                            </form>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* BUYURTMALAR TARIXI */}
                    {isOrdersOpen && (
                        <div onClick={() => setIsOrdersOpen(false)} className="fixed inset-0 z-50 bg-black/85 backdrop-blur-2xl flex justify-start">
                            <div onClick={e => e.stopPropagation()} className="obsidian-slab w-full max-w-md h-full p-5 overflow-y-auto border-r border-[#ff5500]/30">
                                <div className="flex items-center justify-between pb-4 border-b border-white/10">
                                    <h2 className="font-syne text-xl font-extrabold text-white">BUYURTMALARIM</h2>
                                    <button onClick={() => setIsOrdersOpen(false)} className="w-9 h-9 rounded-full bg-white/10 text-white">✕</button>
                                </div>
                                <div className="mt-4 space-y-3">
                                    {userOrders.length === 0 ? (
                                        <p className="text-center py-20 text-xs text-white/40 font-mono-tech">FAOL BUYURTMALAR YO'Q</p>
                                    ) : userOrders.map(o => (
                                        <div key={o.id} className="p-4 rounded-2xl bg-white/[0.04] border border-white/10 space-y-1.5">
                                            <div className="flex justify-between items-center">
                                                <span className="font-mono-tech text-xs font-bold text-[#ff9e00]">#{o.id}</span>
                                                <span className="text-[10px] font-bold text-emerald-400">{o.status}</span>
                                            </div>
                                            <p className="text-xs text-white/70">📍 {o.location}</p>
                                            <p className="font-syne text-sm font-extrabold text-white pt-1">{formatPrice(o.totalAmount)}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
