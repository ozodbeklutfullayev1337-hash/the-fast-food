        body {

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Holographic Glassmorphism Slabs */
        .holo-slab {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%);
            backdrop-filter: blur(30px) saturate(200%);
            -webkit-backdrop-filter: blur(30px) saturate(200%);
            border: 1px solid rgba(255, 215, 0, 0.18);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.2);
        }

        .gold-border-glow {
            border-color: rgba(255, 215, 0, 0.55) !important;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.25), inset 0 1px 2px rgba(255, 215, 0, 0.3);
        }

        .btn-liquid-gold {
            background: linear-gradient(135deg, #ffe066 0%, #ffd700 50%, #cca100 100%);
            color: #030305;
            font-weight: 800;
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.8);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .btn-liquid-gold:active { transform: scale(0.94); }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        .anim-pulse { animation: pulseGlow 3s infinite ease-in-out; }

        @keyframes flyToCart {
            0% { transform: scale(1) translate(0, 0); opacity: 1; }
            70% { opacity: 1; }
            100% { transform: scale(0.2) translate(var(--tx), var(--ty)); opacity: 0; }
        }
        .flying-orb {
            position: fixed;
            z-index: 9999;
            pointer-events: none;
            animation: flyToCart 0.6s cubic-bezier(0.2, 0.85, 0.4, 1) forwards;
        }

        .photo-vignette {
            background: radial-gradient(circle at 50% 35%, rgba(255, 215, 0, 0.12) 0%, rgba(3, 3, 5, 0.95) 80%);
        }
    </style>
</head>

                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.exponentialRampToValueAtTime(120, now + 0.04);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.05);

        const EXTRAS = [
            { id: 'wagyu', name: "Qo'shimcha Wagyu Kotleti", price: 18000 },

        function App() {
            const [viewMode, setViewMode] = useState('client');
            const [adminTab, setAdminTab] = useState('orders');
            const [isAdminAuthed, setIsAdminAuthed] = useState(false);
            const [products, setProducts] = useState(MASSIVE_MENU);
            const [activeCategory, setActiveCategory] = useState("Barchasi");
            const [search, setSearch] = useState("");
            const [cart, setCart] = useState([]);
            const [selectedProduct, setSelectedProduct] = useState(null);
            const [selectedExtras, setSelectedExtras] = useState([]);
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [isOrdersOpen, setIsOrdersOpen] = useState(false);
            const [userOrders, setUserOrders] = useState([]);
            const [adminOrders, setAdminOrders] = useState([]);

            const [customerPhone, setCustomerPhone] = useState("+998 ");
            const [customerLocation, setCustomerLocation] = useState("");

            const [successOrder, setSuccessOrder] = useState(false);
            const [submitting, setSubmitting] = useState(false);
            const [toast, setToast] = useState(null);

            const [newProd, setNewProd] = useState({
                name: '', description: '', image: '', oldPrice: '', newPrice: '', category: 'Burgerlar'
            });

            const tg = window.Telegram?.WebApp;
            const tgUser = tg?.initDataUnsafe?.user || { id: ADMIN_TELEGRAM_ID, first_name: "Ozodbek" };

            useEffect(() => {
                const canvas = document.getElementById('luxury-canvas');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let w = canvas.width = window.innerWidth;
                let h = canvas.height = window.innerHeight;

                const stars = Array.from({ length: 30 }, () => ({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    r: Math.random() * 1.8 + 0.3,
                    vy: -(Math.random() * 0.4 + 0.1),
                    alpha: Math.random() * 0.6 + 0.2
                }));

                let raf;
                const draw = () => {
                    ctx.clearRect(0, 0, w, h);
                    stars.forEach(s => {
                        s.y += s.vy;
                        if (s.y < 0) { s.y = h; s.x = Math.random() * w; }
                        ctx.beginPath();
                        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                        ctx.fillStyle = '#ffd700';
                        ctx.globalAlpha = s.alpha;
                        ctx.shadowBlur = 12;
                        ctx.shadowColor = '#ffd700';
                        ctx.fill();
                    });
                    raf = requestAnimationFrame(draw);
                };
                draw();
                return () => cancelAnimationFrame(raf);
            }, []);

            useEffect(() => {
                if (tg) {
                    tg.ready();
                    tg.expand();
                    try {
                        tg.setHeaderColor('#030305');
                        tg.setBackgroundColor('#030305');
                    } catch (e) {}
                }
                fetchProducts();
                if (tgUser && String(tgUser.id) === ADMIN_TELEGRAM_ID) {
                    setIsAdminAuthed(true);
                }
            }, []);

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 2200);
            };

            const fetchProducts = async () => {
                try {
                    const res = await fetch('/api/products');
                    const data = await res.json();
                    if (Array.isArray(data) && data.length >= 6) {
                        setProducts(data);
                    }
                } catch (e) {}
            };

            const fetchAdminData = async () => {
                try {
                    const [ordRes, prodRes] = await Promise.all([
                        fetch('/api/admin/orders'),
                        fetch('/api/admin/products')
                    ]);
                    const ordData = await ordRes.json();
                    const prodData = await prodRes.json();
                    setAdminOrders(Array.isArray(ordData) ? ordData : []);
                    if (Array.isArray(prodData) && prodData.length > 0) setProducts(prodData);
                } catch (e) {}
            };

            const detectGpsAddress = () => {
                SoundFX.play('tick');
                if (!navigator.geolocation) {
                    showToast("GPS mavjud emas");
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    async (pos) => {
                        const { latitude, longitude } = pos.coords;
                        try {
                            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&accept-language=uz`);
                            const data = await res.json();
                            if (data?.display_name) {
                                setCustomerLocation(data.display_name);
                                showToast("📍 GPS manzil aniqlandi!");
                            } else {
                                setCustomerLocation(`GPS: ${latitude.toFixed(5)}, ${longitude.toFixed(5)}`);
                            }
                        } catch (err) {
                            setCustomerLocation(`GPS: ${latitude.toFixed(5)}, ${longitude.toFixed(5)}`);
                        }
                    },
                    () => showToast("GPS ruxsati berilmadi")
                );
            };

            const categories = useMemo(() => {
                return ["Barchasi", ...new Set(products.map(p => p.category || "Burgerlar"))];
            }, [products]);

            const filtered = useMemo(() => {
                return products.filter(p => {
                    const matchCat = activeCategory === "Barchasi" || (p.category || "Burgerlar") === activeCategory;
                    const matchSearch = p.name.toLowerCase().includes(search.toLowerCase()) || p.description.toLowerCase().includes(search.toLowerCase());
                    return matchCat && matchSearch;
                });
            }, [products, activeCategory, search]);

            const addToCart = (product, extras = [], e) => {
                if (e) {
                    e.stopPropagation();
                    const rect = e.currentTarget.getBoundingClientRect();
                    const tx = (window.innerWidth / 2) - rect.left;
                    const ty = window.innerHeight - rect.top - 40;
                    const orbId = Date.now() + Math.random();
                    const flying = document.createElement('img');
                    flying.src = product.image;
                    flying.className = 'flying-orb w-12 h-12 rounded-full object-cover border-2 border-yellow-400 shadow-[0_0_20px_#ffd700]';
                    flying.style.left = `${rect.left}px`;
                    flying.style.top = `${rect.top}px`;
                    flying.style.setProperty('--tx', `${tx}px`);
                    flying.style.setProperty('--ty', `${ty}px`);
                    document.body.appendChild(flying);
                    setTimeout(() => flying.remove(), 600);
                }

                SoundFX.play('tick');
                if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy');

                const extrasPrice = extras.reduce((s, x) => s + x.price, 0);
                const extrasText = extras.length > 0 ? ` (+ ${extras.map(x => x.name).join(', ')})` : '';
                const cartItemId = `${product.id}-${extras.map(x => x.id).join('_')}`;
                const finalPrice = Number(product.newPrice) + extrasPrice;

                setCart(prev => {
                    const existing = prev.find(i => i.cartItemId === cartItemId);
                    if (existing) {
                        return prev.map(i => i.cartItemId === cartItemId ? { ...i, qty: i.qty + 1 } : i);
                    }
                    return [...prev, { ...product, cartItemId, name: product.name + extrasText, newPrice: finalPrice, qty: 1 }];
                });
                showToast(`${product.name} savatga tushdi ✨`);
            };

            const updateQty = (cartItemId, delta) => {
                SoundFX.play('tick');
                if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
                setCart(prev => prev.map(i => {
                    if (i.cartItemId === cartItemId) {
                        const newQ = i.qty + delta;
                        return newQ > 0 ? { ...i, qty: newQ } : null;
                    }
                    return i;
                }).filter(Boolean));
            };

            const toggleExtra = (ex) => {
                SoundFX.play('tick');
                setSelectedExtras(prev => prev.some(e => e.id === ex.id) ? prev.filter(e => e.id !== ex.id) : [...prev, ex]);
            };

            const totalAmount = cart.reduce((s, i) => s + (i.newPrice * i.qty), 0);
            const totalItems = cart.reduce((s, i) => s + i.qty, 0);

            const submitOrder = async (e) => {
                e.preventDefault();
                if (!customerLocation.trim() || cart.length === 0) return;
                setSubmitting(true);
                const orderObj = {
                    id: Math.floor(1000 + Math.random() * 9000),

                    name: tgUser.first_name,
                    phone: customerPhone,
                    location: customerLocation,
                    totalAmount,
                    status: "Kutilmoqda",
                    items: cart.map(i => ({ id: i.id, name: i.name, qty: i.qty, price: i.newPrice }))
                };

                try {
                    await fetch('/api/orders', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(orderObj)
                    });
                } catch (err) {}

                SoundFX.play('tick');
                if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                setUserOrders(prev => [orderObj, ...prev]);
                setAdminOrders(prev => [orderObj, ...prev]);
                setCart([]);
                setSubmitting(false);
                setSuccessOrder(true);
                setTimeout(() => { setSuccessOrder(false); setIsCartOpen(false); }, 2800);
            };

            const formatPrice = (p) => Number(p).toLocaleString('uz-UZ') + " so'm";

            if (viewMode === 'admin') {
                return (

                                <span className="font-mono-tech text-[10px] text-[#ffd700] uppercase tracking-widest block">ADMIN OS</span>
                                <h1 className="font-sync text-xl font-extrabold text-[#ffd700]">THE FAST FOOD</h1>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={() => setAdminTab('orders')} className={`px-4 py-2.5 rounded-xl text-xs font-bold ${adminTab === 'orders' ? 'btn-liquid-gold' : 'bg-white/5'}`}>

                                </button>
                                <button onClick={() => setAdminTab('add')} className={`px-4 py-2.5 rounded-xl text-xs font-bold ${adminTab === 'add' ? 'btn-liquid-gold' : 'bg-white/5'}`}>

                                </button>

                                    ← Vitrinaga
                                </button>
                            </div>
                        </div>

                        {adminTab === 'add' ? (
                            <div className="holo-slab rounded-3xl p-6">
                                <h2 className="font-sync text-lg font-bold mb-4 text-[#ffd700]">Yangi Taom Qo'shish</h2>
                                <form onSubmit={async (e) => {
                                    e.preventDefault();
                                    const created = {
                                        ...newProd,
                                        id: Date.now(),

                                        newPrice: Number(newProd.newPrice),
                                        badge: "YANGI 🔥",
                                        prepTime: "12 daq",
                                        kcal: "720 KCAL"
                                    };
                                    try {
                                        await fetch('/api/admin/products', {
                                            method: 'POST',
                                            headers: {'Content-Type': 'application/json'},
                                            body: JSON.stringify(created)
                                        });
                                    } catch (err) {}
                                    setProducts(prev => [created, ...prev]);
                                    setNewProd({ name: '', description: '', image: '', oldPrice: '', newPrice: '', category: 'Burgerlar' });
                                    showToast("Taom qo'shildi!");
                                }} className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <input type="text" placeholder="Taom Nomi" value={newProd.name} onChange={e => setNewProd({...newProd, name: e.target.value})} className="p-3.5 rounded-xl bg-black/60 border border-[#ffd700]/30 text-xs text-white" required />
                                    <select value={newProd.category} onChange={e => setNewProd({...newProd, category: e.target.value})} className="p-3.5 rounded-xl bg-black/60 border border-[#ffd700]/30 text-xs font-bold text-[#ffd700]">
                                        <option value="Burgerlar">Burgerlar</option>
                                        <option value="Hot-Doglar">Hot-Doglar</option>
                                        <option value="Lavash">Lavash</option>
                                        <option value="Pitsa">Pitsa</option>
                                        <option value="Sneklar">Sneklar</option>
                                        <option value="Ichimliklar">Ichimliklar</option>
                                    </select>
                                    <input type="number" placeholder="Eski Narxi" value={newProd.oldPrice} onChange={e => setNewProd({...newProd, oldPrice: e.target.value})} className="p-3.5 rounded-xl bg-black/60 border border-[#ffd700]/30 text-xs text-white" required />
                                    <input type="number" placeholder="Yangi Narxi" value={newProd.newPrice} onChange={e => setNewProd({...newProd, newPrice: e.target.value})} className="p-3.5 rounded-xl bg-black/60 border border-[#ffd700]/30 text-xs text-white" required />
                                    <input type="url" placeholder="Rasm URL" value={newProd.image} onChange={e => setNewProd({...newProd, image: e.target.value})} className="sm:col-span-2 p-3.5 rounded-xl bg-black/60 border border-[#ffd700]/30 text-xs text-white" required />
                                    <textarea placeholder="Ta'rifi..." value={newProd.description} onChange={e => setNewProd({...newProd, description: e.target.value})} className="sm:col-span-2 p-3.5 rounded-xl bg-black/60 border border-[#ffd700]/30 text-xs text-white" rows="3" required />
                                    <button type="submit" className="sm:col-span-2 btn-liquid-gold py-4 rounded-xl text-xs font-extrabold uppercase">Saqlash</button>
                                </form>
                            </div>
                        ) : (
                            <div className="space-y-3">
                                {adminOrders.length === 0 ? (
                                    <div className="holo-slab rounded-3xl p-12 text-center text-white/40 text-xs">Buyurtmalar yo'q</div>
                                ) : adminOrders.map(o => (
                                    <div key={o.id} className="holo-slab rounded-2xl p-5 flex items-center justify-between">
                                        <div>
                                            <span className="font-mono-tech text-xs text-[#ffd700] font-bold">#{o.id} — {o.name} ({o.phone})</span>
                                            <p className="text-xs text-white/70 mt-1">📍 {o.location}</p>
                                        </div>
                                        <div className="text-right">
                                            <span className="font-serif-lux text-lg font-bold">{formatPrice(o.totalAmount)}</span>
                                            <span className="block text-[10px] text-emerald-400">{o.status}</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-36 relative">
                    {toast && (
                        <div className="fixed top-20 left-1/2 -translate-x-1/2 z-50 btn-liquid-gold px-6 py-3 rounded-full text-xs font-extrabold shadow-2xl flex items-center gap-2">
                            <span>✨</span><span>{toast}</span>
                        </div>
                    )}

                    {/* ULTRA-LUXURY HEADER */}
                    <header className="sticky top-0 z-30 bg-[#030305]/85 backdrop-blur-2xl border-b border-[#ffd700]/20">
                        <div className="max-w-[1240px] mx-auto px-4 h-20 flex items-center justify-between gap-2">
                            <div className="flex items-center gap-3">
                                <div className="w-11 h-11 rounded-2xl btn-liquid-gold flex items-center justify-center font-sync font-extrabold text-lg shadow-lg">
                                    FF
                                </div>
                                <div>
                                    <span className="font-sync text-sm sm:text-base font-extrabold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-[#ffe066] via-[#ffd700] to-[#cca100] block">THE FAST FOOD</span>
                                    <span className="font-mono-tech text-[9px] text-white/45 tracking-widest uppercase block">Holographic Gourmet OS</span>
                                </div>
                            </div>

                            <div className="flex items-center gap-2">
                                {(String(tgUser.id) === ADMIN_TELEGRAM_ID || isAdminAuthed) && (
                                    <button onClick={() => { SoundFX.play('tick'); setViewMode('admin'); fetchAdminData(); }} className="btn-liquid-gold px-4 py-2.5 rounded-2xl text-[11px] font-extrabold uppercase">
                                        ⚙️ Admin
                                    </button>
                                )}
                            </div>
                        </div>
                    </header>

                    {/* HERO BANNER */}
                    <section className="max-w-[1240px] mx-auto px-4 pt-6 pb-2">
                        <div className="relative w-full h-[360px] rounded-[34px] overflow-hidden holo-slab gold-border-glow flex items-end p-8">
                            <img src="https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&w=1200&q=90" className="absolute inset-0 w-full h-full object-cover opacity-75 brightness-90" />
                            <div className="absolute inset-0 bg-gradient-to-t from-[#030305] via-[#030305]/40 to-transparent" />
                            <div className="relative z-10 text-white space-y-2.5 max-w-lg">
                                <span className="bg-[#ffd700] text-[#030305] text-[10px] font-mono-tech font-extrabold uppercase px-3 py-1 rounded-full tracking-wider">100% MARMAR MOL GO'SHTI</span>
                                <h1 className="font-serif-lux text-3xl sm:text-5xl font-bold leading-tight">Dunyodagi Eng Sersuv Va Mazali Fast-Food</h1>
                                <p className="text-xs text-gray-300 font-mono-tech">Ochiq olovda tayyorlangan gril taomlari va eksklyuziv pitsalar.</p>
                            </div>
                        </div>
                    </section>

                    {/* CATEGORY DOCK */}
                    <section className="max-w-[1240px] mx-auto px-4 pt-6 sticky top-20 z-20 bg-[#030305]/90 backdrop-blur-xl pb-4">
                        <div className="flex items-center gap-2.5 overflow-x-auto no-scrollbar py-1">
                            {categories.map(cat => {
                                const active = activeCategory === cat;
                                return (
                                    <button
                                        key={cat}
                                        onClick={() => { SoundFX.play('tick'); setActiveCategory(cat); }}
                                        className={`px-5 py-3 rounded-2xl text-xs font-bold shrink-0 transition-all ${
                                            active
                                                ? 'btn-liquid-gold shadow-lg scale-105'
                                                : 'holo-slab text-white/70 hover:text-white border-white/10'
                                        }`}
                                    >
                                        {cat}
                                    </button>
                                );
                            })}
                        </div>
                    </section>

                    {/* MENU MATRIX GRID */}
                    <section className="max-w-[1240px] mx-auto px-4 py-6">
                        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">
                            {filtered.map((product) => {
                                const qty = cart.filter(i => i.id === product.id).reduce((s, i) => s + i.qty, 0);
                                return (
                                    <div
                                        key={product.id}
                                        onClick={() => { SoundFX.play('tick'); setSelectedProduct(product); setSelectedExtras([]); }}
                                        className="holo-slab rounded-[30px] p-4 cursor-pointer flex flex-col justify-between group hover:border-[#ffd700]/50 transition-all duration-300"
                                    >
                                        <div>
                                            <div className="relative aspect-[1/0.95] rounded-[22px] overflow-hidden bg-[#0a0b10] mb-3 border border-white/10">
                                                <div className="absolute inset-0 photo-vignette" />
                                                <img src={product.image} alt={product.name} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700 ease-out" />
                                                <span className="absolute top-2.5 left-2.5 bg-black/75 backdrop-blur-md text-[#ffd700] text-[9px] font-mono-tech font-bold uppercase px-2.5 py-1 rounded-full border border-[#ffd700]/30">
                                                    {product.badge}
                                                </span>
                                            </div>
                                            <p className="font-mono-tech text-[9px] text-[#ffd700] uppercase tracking-wider">{product.tagline || product.category}</p>
                                            <h3 className="font-serif-lux text-lg font-bold text-white group-hover:text-[#ffd700] transition-colors line-clamp-1 mt-0.5">{product.name}</h3>
                                            <p className="text-[11px] text-white/50 mt-1 line-clamp-2 leading-relaxed">{product.description}</p>
                                        </div>

                                        <div className="flex items-center justify-between pt-4 mt-3 border-t border-white/10">
                                            <span className="font-serif-lux text-lg font-extrabold text-white">{formatPrice(product.newPrice)}</span>
                                            <button
                                                onClick={(e) => addToCart(product, [], e)}
                                                className={`h-10 px-4 rounded-2xl font-mono-tech font-bold text-xs transition-all ${
                                                    qty > 0 ? 'btn-liquid-gold' : 'bg-white/10 hover:bg-[#ffd700] hover:text-black text-white border border-white/15'
                                                }`}
                                            >
                                                {qty > 0 ? `${qty}x` : '+ QO\'SHISH'}
                                            </button>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </section>

                    {/* FIXED BOTTOM DOCK (BUYURTMALAR & SAVAT) */}
                    <div className="fixed bottom-4 left-4 right-4 z-40 max-w-[820px] mx-auto">
                        <div className="holo-slab gold-border-glow rounded-[30px] p-3 flex items-center gap-3 backdrop-blur-2xl">
                            <button
                                onClick={() => { SoundFX.play('tick'); fetch(`/api/orders/${tgUser.id}`).then(r=>r.json()).then(d=>setUserOrders(Array.isArray(d)?d:[])).catch(()=>{}); setIsOrdersOpen(true); }}
                                className="px-5 py-4 rounded-2xl bg-white/10 hover:bg-white/20 text-white text-xs font-bold flex items-center gap-2 shrink-0 border border-white/15"
                            >
                                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping" />
                                <span>📦 Buyurtmalar</span>
                            </button>

                            <button
                                onClick={() => { SoundFX.play('tick'); setIsCartOpen(true); }}
                                className="flex-1 btn-liquid-gold py-4 px-6 rounded-2xl flex items-center justify-between shadow-2xl"
                            >
                                <div className="flex items-center gap-2.5">
                                    <span className="text-base">🛒</span>
                                    <span className="font-sync text-xs sm:text-sm font-extrabold uppercase tracking-wider">SAVAT</span>
                                    {totalItems > 0 && (
                                        <span className="bg-black text-[#ffd700] px-2.5 py-0.5 rounded-full text-xs font-mono-tech font-bold">
                                            {totalItems}
                                        </span>
                                    )}
                                </div>
                                <span className="font-serif-lux text-base font-extrabold">{formatPrice(totalAmount)}</span>
                            </button>
                        </div>
                    </div>

                    {/* DISH CUSTOMIZATION MODAL */}
                    {selectedProduct && (
                        <div onClick={() => setSelectedProduct(null)} className="fixed inset-0 z-50 bg-black/80 backdrop-blur-2xl flex items-end sm:items-center justify-center p-0 sm:p-4">
                            <div onClick={e => e.stopPropagation()} className="holo-slab gold-border-glow w-full max-w-lg rounded-t-[36px] sm:rounded-[36px] p-6 max-h-[90vh] overflow-y-auto">
                                <div className="relative h-60 w-full rounded-[24px] overflow-hidden mb-4 border border-white/15">
                                    <img src={selectedProduct.image} className="w-full h-full object-cover" />
                                    <button onClick={() => setSelectedProduct(null)} className="absolute top-3 right-3 w-9 h-9 rounded-full bg-black/70 text-white font-bold border border-white/20">✕</button>
                                </div>

                                <h3 className="font-serif-lux text-3xl font-bold text-white mb-1">{selectedProduct.name}</h3>
                                <p className="text-xs text-white/70 mb-5 leading-relaxed">{selectedProduct.description}</p>

                                <div className="space-y-2 mb-6">
                                    <span className="font-mono-tech text-[10px] text-[#ffd700] uppercase tracking-widest block mb-2">+ GOURMET QO'SHIMCHALAR:</span>
                                    {EXTRAS.map(ex => {
                                        const checked = selectedExtras.some(e => e.id === ex.id);
                                        return (
                                            <div
                                                key={ex.id}
                                                onClick={() => toggleExtra(ex)}
                                                className={`p-3.5 rounded-2xl border cursor-pointer flex items-center justify-between transition ${
                                                    checked ? 'border-[#ffd700] bg-[#ffd700]/15' : 'border-white/10 bg-white/[0.03]'
                                                }`}
                                            >
                                                <span className="text-xs font-bold text-white">{ex.name}</span>
                                                <span className="font-mono-tech text-xs font-bold text-[#ffd700]">+{formatPrice(ex.price)}</span>
                                            </div>
                                        );
                                    })}
                                </div>

                                <div className="flex items-center justify-between pt-4 border-t border-white/15">
                                    <div>
                                        <span className="font-mono-tech text-[10px] text-white/40 block">JAMI NARX</span>
                                        <span className="font-serif-lux text-2xl font-bold text-white">
                                            {formatPrice(Number(selectedProduct.newPrice) + selectedExtras.reduce((s, e) => s + e.price, 0))}
                                        </span>
                                    </div>
                                    <button
                                        onClick={(e) => {
                                            addToCart(selectedProduct, selectedExtras, e);
                                            setSelectedProduct(null);
                                        }}
                                        className="btn-liquid-gold px-7 py-4 rounded-2xl text-xs font-extrabold uppercase tracking-wider"
                                    >
                                        + Savatga Qo'shish
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* CHECKOUT VAULT (SAVAT) */}
                    {isCartOpen && (
                        <div onClick={() => setIsCartOpen(false)} className="fixed inset-0 z-50 bg-black/80 backdrop-blur-2xl flex justify-end">
                            <div onClick={e => e.stopPropagation()} className="holo-slab w-full max-w-md h-full p-6 flex flex-col justify-between overflow-y-auto border-l border-[#ffd700]/30">
                                <div>
                                    <div className="flex items-center justify-between pb-4 border-b border-white/15">
                                        <div>
                                            <span className="font-mono-tech text-[10px] text-[#ffd700]">VIP RASMIYLASHTIRISH</span>
                                            <h2 className="font-sync text-lg font-extrabold text-white">SAVATCHA</h2>
                                        </div>
                                        <button onClick={() => setIsCartOpen(false)} className="w-9 h-9 rounded-full bg-white/10 text-white font-bold">✕</button>
                                    </div>

                                    {successOrder ? (
                                        <div className="py-20 text-center space-y-3">
                                            <div className="w-20 h-20 rounded-full btn-liquid-gold flex items-center justify-center text-3xl mx-auto text-black font-bold shadow-2xl">✓</div>
                                            <h3 className="font-sync text-xl font-extrabold text-white">BUYURTMA QABUL QILINDI!</h3>
                                            <p className="text-xs text-white/60">Oshpazlarimiz taomni tayyorlashni boshladi.</p>
                                        </div>
                                    ) : cart.length === 0 ? (
                                        <p className="text-center py-20 text-xs text-white/40 font-mono-tech">SAVATCHANGIZ BO'SH</p>
                                    ) : (
                                        <div className="mt-4 space-y-3">
                                            {cart.map(item => (
                                                <div key={item.cartItemId} className="flex items-center gap-3 p-3 rounded-2xl bg-white/[0.04] border border-white/10">
                                                    <img src={item.image} className="w-14 h-14 rounded-xl object-cover shrink-0" />
                                                    <div className="flex-1 min-w-0">
                                                        <h4 className="text-xs font-bold text-white truncate">{item.name}</h4>
                                                        <p className="font-mono-tech text-xs text-[#ffd700] font-bold mt-0.5">{formatPrice(item.newPrice)}</p>
                                                    </div>
                                                    <div className="flex items-center gap-2 bg-black/60 border border-white/15 px-3 py-1 rounded-xl">
                                                        <button onClick={() => updateQty(item.cartItemId, -1)} className="font-bold text-sm">−</button>
                                                        <span className="font-mono-tech text-xs font-bold w-4 text-center">{item.qty}</span>
                                                        <button onClick={() => updateQty(item.cartItemId, 1)} className="font-bold text-sm">+</button>
                                                    </div>
                                                </div>
                                            ))}

                                            <form onSubmit={submitOrder} className="pt-4 space-y-4">
                                                <div>
                                                    <label className="block font-mono-tech text-[10px] uppercase text-white/60 mb-1">Telefon raqam</label>
                                                    <input type="tel" required value={customerPhone} onChange={e => setCustomerPhone(e.target.value)} className="w-full bg-black/60 border border-white/15 rounded-xl p-3.5 text-xs font-bold text-white focus:outline-none focus:border-[#ffd700]" />
                                                </div>

                                                <div>
                                                    <div className="flex items-center justify-between mb-1">
                                                        <label className="font-mono-tech text-[10px] uppercase text-white/60">Yetkazib berish manzili</label>
                                                        <button type="button" onClick={detectGpsAddress} className="text-[10px] font-mono-tech font-bold text-[#ffd700] hover:underline">
                                                            📍 GPS orqali aniqlash
                                                        </button>
                                                    </div>
                                                    <textarea required rows="2" value={customerLocation} onChange={e => setCustomerLocation(e.target.value)} placeholder="Toshkent sh., ko'cha, uy..." className="w-full bg-black/60 border border-white/15 rounded-xl p-3.5 text-xs text-white focus:outline-none focus:border-[#ffd700]" />
                                                </div>

                                                <div className="p-4 rounded-2xl bg-white/[0.04] border border-white/10 flex justify-between items-center">
                                                    <span className="text-xs text-white/70">Jami to'lov:</span>
                                                    <span className="font-serif-lux text-xl font-bold text-[#ffd700]">{formatPrice(totalAmount)}</span>
                                                </div>

                                                <button type="submit" disabled={submitting} className="w-full btn-liquid-gold py-4 rounded-2xl text-xs font-extrabold uppercase tracking-widest shadow-2xl">
                                                    {submitting ? "Yuborilmoqda..." : "Buyurtmani Tasdiqlash 🔥"}
                                                </button>
                                            </form>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* BUYURTMALAR TARIXI */}
                    {isOrdersOpen && (
                        <div onClick={() => setIsOrdersOpen(false)} className="fixed inset-0 z-50 bg-black/80 backdrop-blur-2xl flex justify-start">
                            <div onClick={e => e.stopPropagation()} className="holo-slab w-full max-w-md h-full p-6 overflow-y-auto border-r border-[#ffd700]/30">
                                <div className="flex items-center justify-between pb-4 border-b border-white/15">
                                    <h2 className="font-sync text-lg font-extrabold text-white">BUYURTMALARIM</h2>
                                    <button onClick={() => setIsOrdersOpen(false)} className="w-9 h-9 rounded-full bg-white/10 text-white font-bold">✕</button>
                                </div>
                                <div className="mt-4 space-y-3">
                                    {userOrders.length === 0 ? (
                                        <p className="text-center py-20 text-xs text-white/40 font-mono-tech">FAOL BUYURTMALAR YO'Q</p>
                                    ) : userOrders.map(o => (
                                        <div key={o.id} className="p-4 rounded-2xl bg-white/[0.04] border border-white/10 space-y-1">
                                            <div className="flex justify-between items-center">
                                                <span className="font-mono-tech text-xs font-bold text-[#ffd700]">#{o.id}</span>
                                                <span className="text-[10px] font-bold text-emerald-400">{o.status}</span>
                                            </div>
                                            <p className="text-xs text-white/70">📍 {o.location}</p>
                                            <p className="font-serif-lux text-base font-bold text-white pt-1">{formatPrice(o.totalAmount)}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
