    <style>
        :root {
            --color-deep-forest: #00473c;
            --color-lime-glow: #e6ff55;
            --color-sage-mist: #d8e5d6;
            --color-warm-sand: #e8dcc6;

            --shadow-lux: rgba(14, 21, 14, 0.25) 0px 20px 40px -12px;
            --shadow-hover: rgba(0, 71, 60, 0.3) 0px 30px 60px -15px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--color-cream-canvas);
            color: var(--color-forest-shadow);
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            user-select: none;
        }

        .font-display { font-family: 'Anton', sans-serif; letter-spacing: 0.015em; text-transform: uppercase; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .food-stage {
            position: relative;
            aspect-ratio: 1 / 1;
            border-radius: 18px;
            overflow: hidden;
            background: linear-gradient(135deg, #e8dcc6 0%, #d8e5d6 100%);
        }
        .food-stage img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;

        .btn-lime-lux {
            background-color: var(--color-lime-glow);
            color: var(--color-forest-shadow);
            border-radius: 9999px;
            font-weight: 800;
            box-shadow: var(--shadow-lux);
            transition: all 0.25s ease;
        }
        .btn-lime-lux:active { transform: scale(0.95); }
    </style>
</head>

        function App() {
            const [viewMode, setViewMode] = useState('client');
            const [isAdminAuthed, setIsAdminAuthed] = useState(false);
            const [products, setProducts] = useState(MASSIVE_MENU);
            const [activeCategory, setActiveCategory] = useState("Barchasi");
            const [search, setSearch] = useState("");
            const [cart, setCart] = useState([]);
            const [selectedProduct, setSelectedProduct] = useState(null);
            const [selectedExtras, setSelectedExtras] = useState([]);
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [isOrdersOpen, setIsOrdersOpen] = useState(false);
            const [userOrders, setUserOrders] = useState([]);
            const [adminOrders, setAdminOrders] = useState([]);
            
            const [customerPhone, setCustomerPhone] = useState("+998 ");
            const [customerLocation, setCustomerLocation] = useState("");

            const [successOrder, setSuccessOrder] = useState(false);
            const [submitting, setSubmitting] = useState(false);
            const [toast, setToast] = useState(null);

            const [newProd, setNewProd] = useState({
                name: '', description: '', image: '', oldPrice: '', newPrice: '', category: 'Burgerlar'
            });

            const tg = window.Telegram?.WebApp;
            const tgUser = tg?.initDataUnsafe?.user || { id: ADMIN_TELEGRAM_ID, first_name: "Ozodbek" };

                if (tg) {
                    tg.ready();
                    tg.expand();
                }
                fetchProducts();

                if (tgUser && String(tgUser.id) === ADMIN_TELEGRAM_ID) {
                    setIsAdminAuthed(true);
                } else if (localStorage.getItem('admin_auth') === 'true') {
                    setIsAdminAuthed(true);
                }
            }, []);

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 2000);
            };

            const fetchProducts = async () => {
                try {
                    const res = await fetch('/api/products');
                    const data = await res.json();
                    if (Array.isArray(data) && data.length >= 6) {
                        setProducts(data);
                    }
                } catch (e) {}
            };

            const fetchAdminData = async () => {
                try {
                    const [ordRes, prodRes] = await Promise.all([
                        fetch('/api/admin/orders'),
                        fetch('/api/admin/products')
                    ]);
                    const ordData = await ordRes.json();
                    const prodData = await prodRes.json();
                    setAdminOrders(Array.isArray(ordData) ? ordData : []);
                    if (Array.isArray(prodData) && prodData.length > 0) setProducts(prodData);
                } catch (e) {}
            };

            const categories = useMemo(() => {
                return ["Barchasi", ...new Set(products.map(p => p.category || "Fast Food"))];
            }, [products]);

            const filtered = useMemo(() => {
                return products.filter(p => {
                    const matchCat = activeCategory === "Barchasi" || (p.category || "Fast Food") === activeCategory;
                    const matchSearch = p.name.toLowerCase().includes(search.toLowerCase()) || p.description.toLowerCase().includes(search.toLowerCase());
                    return matchCat && matchSearch;
                });
            }, [products, activeCategory, search]);

            const addToCart = (product, extras = [], e) => {
                if (e) e.stopPropagation();
                if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

                const extrasPrice = extras.reduce((s, x) => s + x.price, 0);
                const extrasText = extras.length > 0 ? ` (+ ${extras.map(x => x.name).join(', ')})` : '';
                const cartItemId = `${product.id}-${extras.map(x => x.id).join('_')}`;
                const finalPrice = Number(product.newPrice) + extrasPrice;

                setCart(prev => {
                    const existing = prev.find(i => i.cartItemId === cartItemId);
                    if (existing) {
                        return prev.map(i => i.cartItemId === cartItemId ? { ...i, qty: i.qty + 1 } : i);
                    }
                    return [...prev, { ...product, cartItemId, name: product.name + extrasText, newPrice: finalPrice, qty: 1 }];
                });
                showToast(`${product.name} savatga qo'shildi!`);
            };

            const updateQty = (cartItemId, delta) => {
                if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
                setCart(prev => prev.map(i => {
                    if (i.cartItemId === cartItemId) {
                        const newQ = i.qty + delta;
                        return newQ > 0 ? { ...i, qty: newQ } : null;
                    }
                    return i;
                }).filter(Boolean));
            };

            const toggleExtra = (ex) => {
                setSelectedExtras(prev => prev.some(e => e.id === ex.id) ? prev.filter(e => e.id !== ex.id) : [...prev, ex]);

            const totalAmount = cart.reduce((s, i) => s + (i.newPrice * i.qty), 0);

                e.preventDefault();
                if (!customerLocation.trim() || cart.length === 0) return;
                setSubmitting(true);

            };

            const formatPrice = (p) => Number(p).toLocaleString('uz-UZ') + " so'm";

            // ADMIN PANEL
            if (viewMode === 'admin') {
                return (

                        </aside>

                                        headers: {'Content-Type': 'application/json'},

                                    });
                                    setNewProd({ name: '', description: '', image: '', oldPrice: '', newPrice: '', category: 'Burgerlar' });
                                    showToast("Qo'shildi!");
                                    fetchAdminData();

                                    <select value={newProd.category} onChange={e => setNewProd({...newProd, category: e.target.value})} className="p-3 bg-[#f4f3e7] border rounded-lg text-xs font-bold">

                                        <option value="Pitsa">Pitsa</option>
                                        <option value="Sneklar">Sneklar</option>

                                    <input type="number" placeholder="Yangi Narx" value={newProd.newPrice} onChange={e => setNewProd({...newProd, newPrice: e.target.value})} className="p-3 bg-[#f4f3e7] border rounded-lg text-xs" required />

                                    <button type="submit" className="sm:col-span-2 btn-lime-lux py-3 text-xs">Qo'shish</button>
                                </form>

                            <span className="bg-[#e6ff55] text-[#0e150e] text-[10px] font-extrabold uppercase px-2.5 py-0.5 rounded-full inline-block mb-2">100% MARMAR MOL GO'SHTI</span>
                            <h1 className="font-display text-[28px] text-[#0e150e] mb-2 leading-[0.9]">ENG SERSUV BURGER VA HOT-DOGLAR</h1>
                            <p className="text-xs text-[#0e150e]/80 mb-4">Ochiq olovda tayyorlangan gril taomlari. Issiq holda yetkazamiz.</p>
                            <button onClick={() => document.getElementById('menu-section').scrollIntoView({ behavior: 'smooth' })} className="btn-lime-lux px-5 py-3 text-xs w-full text-center">
                                Menyuni ko'rish →
                            </button>
                        </div>
                    </section>

                    <section id="menu-section" className="max-w-[1200px] mx-auto px-3 pt-8">
                        <div className="flex items-baseline gap-5 overflow-x-auto no-scrollbar pb-3 border-b border-[#0e150e]/15">
                            {categories.map(cat => {
                                const isActive = activeCategory === cat;
                                return (
                                    <button key={cat} onClick={() => setActiveCategory(cat)} className="group relative flex flex-col items-center shrink-0">
                                        <span className={`font-display text-[22px] transition ${isActive ? 'text-[#0e150e]' : 'text-[#8c8c82]'}`}>{cat}</span>
                                        <span className={`mt-1 w-2 h-2 rounded-full bg-[#00473c] transition ${isActive ? 'opacity-100' : 'opacity-0'}`}></span>
                                    </button>
                                );
                            })}
                        </div>
                    </section>

                    <section className="max-w-[1200px] mx-auto px-3 py-6">
                        <div className="grid grid-cols-2 gap-3 sm:gap-6">
                            {filtered.map((product) => {
                                const qty = cart.filter(i => i.id === product.id).reduce((s, i) => s + i.qty, 0);
                                return (
                                    <div key={product.id} onClick={() => { setSelectedProduct(product); setSelectedExtras([]); }} className="food-item-card cursor-pointer group bg-white/40 p-2.5 rounded-[18px] border border-[#0e150e]/10 flex flex-col justify-between">
                                        <div>
                                            <div className="food-stage shadow-sm mb-2.5">
                                                <img src={product.image} alt={product.name} />
                                                {product.badge && <span className="absolute top-2 left-2 bg-[#e6ff55] text-[#0e150e] text-[9px] font-extrabold uppercase px-2 py-0.5 rounded-full shadow">{product.badge}</span>}
                                            </div>
                                            <h3 className="text-[14px] font-extrabold text-[#0e150e] leading-tight line-clamp-1">{product.name}</h3>
                                            <p className="text-[11px] text-[#0e150e]/75 mt-1 line-clamp-2 leading-tight">{product.description}</p>
                                        </div>
                                        <div className="flex items-center justify-between pt-3 mt-2 border-t border-[#0e150e]/10">
                                            <span className="text-[13px] font-extrabold text-[#00473c]">{formatPrice(product.newPrice)}</span>
                                            <button onClick={(e) => addToCart(product, [], e)} className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs transition ${qty > 0 ? 'bg-[#e6ff55] text-[#0e150e]' : 'bg-[#00473c] text-[#f4f3e7]'}`}>
                                                {qty > 0 ? qty : '+'}
                                            </button>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </section>

                    {/* ======================================================== */}
                    {/* DOIMIY KATTA VA QULAY PASTGI PANELI (BUYURTMALAR VA SAVAT) */}
                    {/* ======================================================== */}
                    <div className="fixed bottom-0 left-0 right-0 z-40 bg-[#f4f3e7]/95 backdrop-blur-xl border-t border-[#0e150e]/15 p-4 shadow-2xl">
                        <div className="max-w-[1200px] mx-auto flex items-center gap-3">
                            <button 
                                onClick={() => {
                                    fetch(`/api/orders/${tgUser.id}`).then(r=>r.json()).then(d=>setUserOrders(Array.isArray(d)?d:[])).catch(()=>{});
                                    setIsOrdersOpen(true);
                                }}
                                className="flex-1 bg-[#d8e5d6] hover:bg-[#c5d8c3] text-[#0e150e] py-3.5 px-4 rounded-2xl flex items-center justify-center gap-2 border border-[#0e150e]/10 shadow-sm active:scale-95 transition"
                            >
                                <span className="text-lg">📦</span>
                                <span className="text-xs font-extrabold uppercase">Buyurtmalar</span>
                            </button>

                            <button 
                                onClick={() => setIsCartOpen(true)}
                                className="flex-1 bg-[#00473c] hover:bg-[#003830] text-[#e6ff55] py-3.5 px-4 rounded-2xl flex items-center justify-between shadow-lg active:scale-95 transition px-5"
                            >
                                <div className="flex items-center gap-2">
                                    <span className="text-lg">🛒</span>
                                    <span className="text-xs font-extrabold uppercase">Savat</span>
                                    {totalItems > 0 && (
                                        <span className="bg-[#e6ff55] text-[#0e150e] px-2 py-0.5 rounded-full text-[10px] font-extrabold">
                                            {totalItems}
                                        </span>
                                    )}
                                </div>
                                <span className="text-xs font-extrabold">{formatPrice(totalAmount)}</span>
                            </button>
                        </div>
                    </div>

                    {/* SAVATCHA VA FORMA */}
                    {isCartOpen && (
                        <div onClick={() => setIsCartOpen(false)} className="fixed inset-0 z-50 bg-[#0e150e]/70 backdrop-blur-sm flex justify-end">
                            <div onClick={e => e.stopPropagation()} className="bg-[#f4f3e7] w-full max-w-md h-full flex flex-col justify-between p-5 overflow-y-auto">
                                <div>
                                    <div className="flex justify-between pb-3 border-b border-[#0e150e]/15">
                                        <h2 className="font-display text-2xl text-[#0e150e]">SAVATCHA</h2>
                                        <button onClick={() => setIsCartOpen(false)} className="font-bold">✕</button>
                                    </div>

                                    {successOrder ? (
                                        <div className="py-12 text-center">
                                            <div className="w-14 h-14 rounded-full bg-[#e6ff55] text-[#0e150e] flex items-center justify-center text-2xl mx-auto mb-3 font-bold">✓</div>
                                            <h3 className="font-display text-xl text-[#00473c] mb-1">BUYURTMA QABUL QILINDI!</h3>
                                            <p className="text-xs text-[#0e150e]/80">Kuryerimiz tez orada siz bilan bog'lanadi.</p>
                                        </div>
                                    ) : cart.length === 0 ? (
                                        <p className="text-center py-12 text-xs text-[#8c8c82]">Savatchangiz bo'sh</p>
                                    ) : (
                                        <div className="mt-4 space-y-3">
                                            {cart.map(item => (
                                                <div key={item.cartItemId} className="flex items-center gap-2 pb-2.5 border-b border-[#0e150e]/10">
                                                    <img src={item.image} className="w-12 h-12 rounded-[10px] object-cover bg-[#e8dcc6]" />
                                                    <div className="flex-1 min-w-0">
                                                        <h4 className="font-bold text-xs text-[#0e150e] truncate">{item.name}</h4>
                                                        <p className="text-[11px] font-extrabold text-[#00473c]">{formatPrice(item.newPrice)}</p>
                                                    </div>
                                                    <div className="flex items-center gap-1.5 bg-[#d8e5d6] px-2.5 py-1 rounded-full shrink-0">
                                                        <button onClick={() => updateQty(item.cartItemId, -1)} className="font-bold text-xs">−</button>
                                                        <span className="text-[11px] font-extrabold w-3 text-center">{item.qty}</span>
                                                        <button onClick={() => updateQty(item.cartItemId, 1)} className="font-bold text-xs">+</button>
                                                    </div>
                                                </div>
                                            ))}

                                            <form onSubmit={submitOrder} className="pt-2 space-y-2.5">
                                                <div>
                                                    <label className="block text-[10px] font-extrabold uppercase text-[#0e150e] mb-1">Telefon raqam</label>
                                                    <input 
                                                        type="tel" 
                                                        required 
                                                        value={customerPhone} 
                                                        onChange={e => setCustomerPhone(e.target.value)} 
                                                        className="w-full bg-white border rounded-[8px] p-2.5 text-xs font-semibold focus:outline-none focus:border-[#00473c]" 
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-[10px] font-extrabold uppercase text-[#0e150e] mb-1">Yetkazib berish manzili</label>
                                                    <textarea 
                                                        required 
                                                        rows="2" 
                                                        value={customerLocation} 
                                                        onChange={e => setCustomerLocation(e.target.value)} 
                                                        placeholder="Masalan: Yunusobod, 4-kvartal..." 
                                                        className="w-full bg-white border rounded-[8px] p-2.5 text-xs font-medium focus:outline-none focus:border-[#00473c]"
                                                    ></textarea>
                                                </div>
                                                <div className="bg-[#d8e5d6] p-2.5 rounded-[10px] flex justify-between font-extrabold text-xs">
                                                    <span>Jami to'lov:</span>
                                                    <span>{formatPrice(totalAmount)}</span>
                                                </div>
                                                <button type="submit" disabled={submitting} className="w-full btn-lime-lux py-3 text-xs">
                                                    {submitting ? "Yuborilmoqda..." : "Buyurtmani tasdiqlash →"}
                                                </button>
                                            </form>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL */}
                    {selectedProduct && (
                        <div onClick={() => setSelectedProduct(null)} className="fixed inset-0 z-50 bg-[#0e150e]/70 backdrop-blur-sm flex items-end justify-center p-0">
                            <div onClick={e => e.stopPropagation()} className="bg-[#f4f3e7] w-full max-w-lg rounded-t-[28px] overflow-hidden p-5 max-h-[85vh] overflow-y-auto">
                                <div className="relative h-48 w-full bg-[#e8dcc6] rounded-[16px] overflow-hidden mb-3">
                                    <img src={selectedProduct.image} className="w-full h-full object-cover" />
                                </div>
                                <h3 className="font-display text-2xl text-[#0e150e] mb-1">{selectedProduct.name}</h3>
                                <p className="text-xs text-[#0e150e]/80 mb-4">{selectedProduct.description}</p>
                                
                                <div className="mb-5 space-y-2">
                                    <p className="text-[11px] font-extrabold uppercase text-[#0e150e] mb-1">QO'SHIMCHALAR:</p>
                                    {EXTRAS.map(ex => {
                                        const checked = selectedExtras.some(e => e.id === ex.id);
                                        return (
                                            <div key={ex.id} onClick={() => toggleExtra(ex)} className={`p-2.5 rounded-[10px] border-2 cursor-pointer flex justify-between items-center text-xs ${checked ? 'border-[#00473c] bg-[#d8e5d6]' : 'border-[#0e150e]/15'}`}>
                                                <span className="font-bold">{ex.name}</span>
                                                <span className="font-extrabold text-[#00473c]">+{formatPrice(ex.price)}</span>
                                            </div>
                                        );
                                    })}
                                </div>

                                <div className="flex items-center justify-between pt-3 border-t border-[#0e150e]/15">
                                    <span className="text-xl font-extrabold text-[#00473c]">{formatPrice(Number(selectedProduct.newPrice) + selectedExtras.reduce((s,e)=>s+e.price,0))}</span>
                                    <button onClick={() => { addToCart(selectedProduct, selectedExtras); setSelectedProduct(null); }} className="btn-lime-lux px-6 py-3 text-xs">Savatga qo'shish</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* BUYURTMALAR TARIXI */}
                    {isOrdersOpen && (
                        <div onClick={() => setIsOrdersOpen(false)} className="fixed inset-0 z-50 bg-[#0e150e]/70 backdrop-blur-sm flex justify-start">
                            <div onClick={e => e.stopPropagation()} className="bg-[#f4f3e7] w-full max-w-md h-full p-5 overflow-y-auto">
                                <div className="flex justify-between pb-3 border-b border-[#0e150e]/15">
                                    <h2 className="font-display text-2xl text-[#0e150e]">BUYURTMALAR</h2>
                                    <button onClick={() => setIsOrdersOpen(false)} className="font-bold">✕</button>
                                </div>
                                <div className="mt-4 space-y-2.5">
                                    {userOrders.length === 0 ? <p className="text-xs text-[#8c8c82] py-8 text-center">Buyurtmalar yo'q</p> : userOrders.map(o => (
                                        <div key={o.id} className="bg-[#d8e5d6] p-3.5 rounded-[14px]">
                                            <div className="flex justify-between font-bold text-xs mb-1 text-[#00473c]"><span>#{o.id}</span><span>{o.status}</span></div>
                                            <p className="text-[11px] text-[#0e150e]/75 mb-1">📍 {o.location}</p>
                                            <div className="font-extrabold text-xs">{formatPrice(o.totalAmount)}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
